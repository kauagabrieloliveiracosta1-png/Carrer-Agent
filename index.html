function row(a,b){return `<div class="item"><span class="muted">${a}</span><strong>${b}</strong></div>`}

function about(){alert('Career Agent — simulador de empresário de futebol. Você administra uma agência e representa jogadores. Os clubes são equipes reais do mercado, não instituições controladas pelo jogador.');}

function dashboard(){let v=S.clients.reduce((a,p)=>a+p.value,0);return head('Painel da agência','Visão geral','Acompanhe o crescimento da sua agência e as carreiras dos atletas representados.',`<div class="actions"><button class="primary" onclick="go('negotiations')">Buscar jovens jogadores</button><button onclick="advanceWeek()">Avançar semana</button></div>`)+`<div class="grid stats">${stat('Jogadores representados',S.clients.length,'Atletas sob contrato')}${stat('Valor do portfólio',fmt(v),'Valor estimado','green')}${stat('Saldo da agência',fmt(S.cash),'Caixa disponível')}${stat('Reputação',S.rep+'/100','Credibilidade no mercado')}</div><div class="grid cols">${card('Identidade profissional',`${row('Agência',S.agency)}${row('Agente',S.agent)}${row('Ligas acompanhadas',S.leagues.join(' • ')||'Nenhuma selecionada')}<div class="notice">Você é um empresário independente. Não existe clube de referência: os clubes são parte do mercado de transferências.</div><button style="margin-top:10px" onclick="go('agency')">Editar dados da agência</button>`)}${card('Atividade da agência',`${row('Comissão média','8%')}${row('Receita mensal estimada',fmt(S.income))}${row('Despesas mensais',fmt(S.expenses))}${row('Propostas em análise',S.deals.filter(d=>d.status==='Em análise').length)}<div class="notice">Sua missão é descobrir talentos, conquistar a confiança dos jogadores e negociar as melhores oportunidades.</div>`)}</div><div class="grid cols" style="margin-top:14px">${card('Meus jogadores',S.clients.slice(0,4).map(p=>`<div class="item"><div><strong>${p.name}</strong><div class="muted small">${p.pos} • ${p.club}</div></div><strong class="green">${p.rating}</strong></div>`).join('')||'<div class="empty">Você ainda não representa nenhum jogador. Escolha talentos na aba Jovens disponíveis.</div>'+`<button style="margin-top:10px" onclick="go('negotiations')">Ver jovens disponíveis</button>`)}${card('Últimas notícias',S.news.slice(0,5).map(x=>`<div class="logline">${x}</div>`).join('' function negotiations(){let owned=S.clients.map(p=>p.id).filter(Boolean);return head('Recrutamento','Jovens disponíveis','Negocie diretamente com jovens fictícios para conquistar o direito de representá-los. Cada atleta tem potencial, personalidade e situação contratual próprios.')+`<div class="notice" style="margin-bottom:14px">Estes jovens são personagens fictícios do Career Agent. Você escolhe individualmente quem abordar; ninguém entra automaticamente no seu portfólio.</div><div class="playergrid">${(S.youthPool||[]).filter(p=>!owned.includes(p.id)).map(p=>`<div class="playercard"><div class="playerhead"><div><strong>${p.name}</strong><div class="muted small">${p.age} anos • ${p.country}</div></div><div class="rating">${p.rating}</div></div><div class="divider"></div>${row('Posição',p.pos)}${row('Clube atual',p.club)}${row('Potencial',p.potential+'/100')}${row('Valor estimado',fmt(p.value))}${row('Situação',p.contract)}<div class="bar"><i style="width:${p.potential}%"></i></div><div class="formgrid" style="margin-top:12px"><div><label>Comissão proposta (%)</label><input id="fee_${p.id}" type="number" min="5" max="15" value="8"></div><div><label>Duração (meses)</label><select id="term_${p.id}"><option value="12">12 meses</option><option value="24" selected>24 meses</option><option value="36">36 meses</option></select></div></div><button class="primary" style="width:100%;margin-top:10px" onclick="approachYouth('${p.id}')">Enviar proposta de representação</button></div>`).join('')||'<div class="empty">Você já abordou todos os jovens disponíveis. Novos talentos poderão surgir com a evolução do mercado.</div>'}</div><div class="grid cols" style="margin-top:14px">${card('Como funciona',`<p class="muted">1. Escolha um jovem para abordar.</p><p class="muted">2. Faça uma proposta de representação.</p><p class="muted">3. Se ele aceitar, passa a integrar seus jogadores.</p><p class="muted">4. Depois, cuide da carreira, dos contratos e das transferências.</p>`)}${card('Negociações recentes',S.log.slice(0,5).map(x=>`<div class="logline">${x}</div>`).join(''))}</div>`}
function approachYouth(id){let p=(S.youthPool||[]).find(x=>x.id===id);if(!p)return;if(S.clients.some(x=>x.id===id))return toast('Você já representa este jogador.');let fee=Number(document.getElementById('fee_'+id)?.value||8),term=Number(document.getElementById('term_'+id)?.value||24);if(fee<5||fee>15)return toast('A comissão deve ficar entre 5% e 15%.');let chance=Math.max(.25,Math.min(.95,.48+(fee-8)*.055+(S.rep-10)*.003+(term>=24?.06:0)));if(Math.random()>chance){log(`${p.name} recusou a proposta de ${fee}% por ${term} meses.`);S.rep=Math.max(0,S.rep-1);autoSave();render();return toast(p.name+' recusou a proposta. Você pode tentar novamente com melhores condições.')}let client={...p,fee,term,relationship:58,status:'Contrato ativo'};S.clients.push(client);S.youthPool=S.youthPool.filter(x=>x.id!==id);S.rep=Math.min(100,S.rep+3);S.income+=.002;log(`${p.name} aceitou a proposta de representação: comissão de ${fee}% por ${term} meses.`);autoSave();render();toast(p.name+' assinou com sua agência!')}
function agency(){return head('Estrutura profissional','Minha agência','Organize sua operação, identidade e reputação como empresário.')+`<div class="grid cols">${card('Dados da agência',`<div class="stack"><label>Nome da agência</label><input id="agencyName" value="${S.agency}"><label>Nome do empresário</label><input id="agentName" value="${S.agent}"><button class="primary" onclick="saveAgency()">Salvar identidade</button></div>`)}${card('Indicadores',`${row('Atletas representados',S.clients.length)}${row('Reputação',S.rep+'/100')}${row('Valor do portfólio',fmt(S.clients.reduce((a,p)=>a+p.value,0)))}${row('Negociações concluídas',S.deals.filter(d=>d.status==='Aceita').length)}`)}</div>`}
function finance(){return head('Administração','Finanças da agência','Controle comissões, despesas e saldo operacional.')+`<div class="grid stats">${stat('Saldo',fmt(S.cash),'Caixa disponível')}${stat('Receita mensal',fmt(S.income),'Comissões estimadas','green')}${stat('Despesas',fmt(S.expenses),'Custos operacionais')}${stat('Resultado',fmt(S.income-S.expenses),'Saldo mensal',(S.income>=S.expenses?'green':'red'))}</div><div class="grid cols">${card('Movimentações',`${row('Comissões recebidas',fmt(S.income))}${row('Despesas da agência',fmt(S.expenses))}${row('Resultado mensal',fmt(S.income-S.expenses))}`)}${card('Investir na agência',`<label>Investimento em prospecção (€ mi)</label><input id="investValue" type="number" min=".01" step=".01" value=".05"><button class="primary" style="margin-top:10px" onclick="investAgency()">Investir em observação de mercado</button><p class="muted small">Aumenta sua reputação e fortalece a rede de contatos da agência.</p>`)}</div>`}

function windowStatus(){
 if(S.week>=20&&S.week<=25)return {open:true,label:'1ª janela de transferências',detail:'Aberta • semanas 20 a 25'};
 if(S.week>=38&&S.week<=46)return {open:true,label:'2ª janela de transferências',detail:'Aberta • semanas 38 a 46 (pós-temporada)'};
 return {open:false,label:'Mercado fechado',detail:S.week===1?'Fecha na semana 1. Próxima abertura: semana 20.':S.week<20?`Próxima abertura na semana 20 (${20-S.week} semana(s)).`:`Próxima abertura na semana 38 (${38-S.week} semana(s)).`};
}
function transferClubs(current){const all=[...new Set(Object.values(leagueTeams).flat())];return all.filter(c=>c!==current);}
function transfers(){
 const w=windowStatus(),pending=S.transferOffers.filter(o=>o.status==='Em negociação');
 return head('Mercado de transferências','Transferências','Negocie a mudança de clube dos jogadores que você representa. A transferência só pode ser concluída durante as janelas oficiais.')
 +`<div class="grid stats">${stat('Semana atual',S.week+'/46','Temporada '+S.seasonYear)}${stat('Situação do mercado',w.open?'ABERTO':'FECHADO',w.label,w.open?'green':'gold')}${stat('Propostas em negociação',pending.length,'Aguardando decisão')}${stat('Transferências concluídas',S.transferOffers.filter(o=>o.status==='Concluída').length,'Nesta carreira')}</div>`
 +`<div class="notice" style="margin-bottom:14px">${w.open?'A janela está aberta. Você pode apresentar propostas aos clubes.':'O mercado está fechado. Você pode consultar o portfólio, mas não enviar propostas agora.'} ${w.detail}</div>`
 +`<h2>Enviar proposta por um jogador</h2><div class="playergrid">${S.clients.map((p,i)=>`<div class="playercard"><div class="playerhead"><div><strong>${p.name}</strong><div class="muted small">${p.club} • ${p.pos} • ${p.age} anos</div></div><div class="rating">${p.rating}</div></div><div class="divider"></div>${row('Valor estimado',fmt(p.value))}${row('Salário atual',fmt(p.wage)+'/mês')}<div class="formgrid" style="margin-top:10px"><div><label>Clube de destino</label><select id="dest_${i}">${transferClubs(p.club).map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Taxa de transferência (€ mi)</label><input id="feeTransfer_${i}" type="number" min="0" step=".1" value="${p.value}"></div><div><label>Novo salário mensal (€ mi)</label><input id="wageTransfer_${i}" type="number" min="0" step=".01" value="${p.wage}"></div><div><label>Duração do contrato</label><select id="yearsTransfer_${i}"><option value="2">2 anos</option><option value="3" selected>3 anos</option><option value="4">4 anos</option><option value="5">5 anos</option></select></div></div><button class="primary" style="width:100%;margin-top:10px" ${w.open?'':'disabled'} onclick="sendTransferOffer(${i})">Enviar proposta ao clube</button></div>`).join('')||'<div class="empty">Você ainda não representa jogadores. Contrate jovens na aba Jovens disponíveis.</div>'}</div>`
 +`<div style="margin-top:18px"><h2>Propostas e histórico</h2>${S.transferOffers.slice().reverse().map(o=>`<div class="card" style="margin-bottom:10px"><div class="row"><strong>${o.player}</strong><span class="pill ${o.status==='Concluída'?'':'warn'}">${o.status}</span></div><div class="muted small">${o.from} → ${o.to} • Taxa: ${fmt(o.fee)} • Salário: ${fmt(o.wage)}/mês • Contrato: ${o.years} anos</div>${o.status==='Em negociação'?`<div class="actions" style="margin-top:10px"><button class="primary" onclick="resolveTransfer(${o.id},true)">Aceitar proposta do clube</button><button class="danger" onclick="resolveTransfer(${o.id},false)">Recusar proposta</button></div>`:''}${o.note?`<p class="muted small">${o.note}</p>`:''}</div>`).join('')||'<div class="empty">Nenhuma proposta de transferência enviada.</div>'}</div>`;
}
function sendTransferOffer(i){
 if(!windowStatus().open)return toast('A janela de transferências está fechada.');
 const p=S.clients[i];if(!p)return;
 const to=document.getElementById('dest_'+i).value,fee=Number(document.getElementById('feeTransfer_'+i).value),wage=Number(document.getElementById('wageTransfer_'+i).value),years=Number(document.getElementById('yearsTransfer_'+i).value);
 if(!to||to===p.club||fee<0||wage<0||!years)return toast('Confira os dados da proposta.');
 if(S.transferOffers.some(o=>o.playerId===(p.id||p.name)&&o.status==='Em negociação'))return toast('Este jogador já tem uma proposta em negociação.');
 const offer={id:Date.now()+Math.floor(Math.random()*999),playerId:p.id||p.name,player:p.name,from:p.club,to,fee,wage,years,status:'Em negociação',week:S.week,note:'Proposta enviada. Aguarde a decisão do clube.'};
 S.transferOffers.push(offer);log(`Proposta enviada: ${p.name}, ${p.club} → ${to}, por ${fmt(fee)}.`);autoSave();render();toast('Proposta enviada ao clube.');
}
function resolveTransfer(id,yes){
 const o=S.transferOffers.find(x=>x.id===id);if(!o||o.status!=='Em negociação')return;
 const p=S.clients.find(x=>(x.id||x.name)===o.playerId||x.name===o.player);
 if(!yes){o.status='Recusada';o.note='A agência recusou a proposta.';log(`Proposta por ${o.player} para ${o.to} foi recusada.`);autoSave();render();return;}
 if(!windowStatus().open)return toast('A janela fechou. A proposta não pode ser concluída.');
 if(!p){o.status='Cancelada';o.note='Jogador não encontrado no portfólio.';autoSave();render();return;}
 const ratio=o.fee/Math.max(.01,p.value||1),chance=Math.max(.18,Math.min(.96,.45+(ratio-.7)*.55+(S.rep/100)*.12));
 if(Math.random()>chance){o.status='Recusada';o.note='O clube recusou a proposta: valor ou condições insuficientes.';log(`${o.to} recusou a proposta por ${o.player}.`);autoSave();render();toast('O clube recusou a proposta.');return;}
 const old=p.club,commission=o.fee*(Number(p.fee||8)/100);p.club=o.to;p.wage=o.wage;p.contract=`${o.years} anos (novo contrato)`;p.value=Math.max(p.value,o.fee);p.lastTransfer={from:old,to:o.to,fee:o.fee,week:S.week,year:S.seasonYear};
 o.status='Concluída';o.note=`Transferência concluída na semana ${S.week}. Comissão da agência: ${fmt(commission)}.`;S.cash+=commission;S.income+=commission/12;S.rep=Math.min(100,S.rep+4);
 log(`TRANSFERÊNCIA CONCLUÍDA: ${p.name} saiu do ${old} e assinou com ${o.to} por ${o.years} anos. Comissão: ${fmt(commission)}.`);autoSave();render();toast(`${p.name} foi transferido para ${o.to}!`);
}
function leagueTable(){
 const chosen=S.selectedLeague&&S.leagues.includes(S.selectedLeague)?S.selectedLeague:(S.leagues[0]||leagues[0]),teams=leagueTeams[chosen]||leagueTeams[leagues[0]];
 const standings=teams.map((team,i)=>{const seed=(i*17+chosen.length*7+S.seasonYear)%31,pts=Math.max(4,62-i*5+(seed%13)-6),w=Math.floor(pts/3),d=pts%3;return {team,pts,w,d,l:Math.max(0,18-w-d),gf:Math.max(8,38-i*2+(seed%9)),ga:Math.max(8,15+i*2+(seed%7))};}).sort((a,b)=>b.pts-a.pts);
 return head('Competições','Tabela das ligas','Consulte a classificação das competições que você escolheu acompanhar.')+`<div class="card" style="margin-bottom:14px"><label>Selecionar liga</label><select onchange="selectLeague(this.value)">${S.leagues.map(l=>`<option value="${l}" ${l===chosen?'selected':''}>${l}</option>`).join('')}</select><div class="muted small" style="margin-top:8px">Temporada ${S.seasonYear} • classificação simulada</div></div><div class="card tablewrap"><table><thead><tr><th>#</th><th>Clube</th><th>PTS</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th></tr></thead><tbody>${standings.map((t,i)=>`<tr><td>${i+1}</td><td><strong>${t.team}</strong></td><td><strong>${t.pts}</strong></td><td>18</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gf-t.ga}</td></tr>`).join('')}</tbody></table></div><p class="muted small">Pontuação e resultados são simulados pelo protótipo e não representam classificação oficial em tempo real.</p>`;
}
function selectLeague(l){S.selectedLeague=l;autoSave();render()}
function calendar(){
 const w=windowStatus(),tiles=Array.from({length:46},(_,i)=>{const n=i+1,label=n===1?'Fechamento':n>=20&&n<=25?'Janela 1':n===38?'Fim da temporada + janela 2':n>38?'Janela 2':'';return `<div class="card" style="padding:10px;text-align:center;border-color:${n===S.week?'var(--accent)':'var(--line)'};background:${n===S.week?'#1c3049':'var(--panel)'}"><div class="small muted">Semana</div><strong style="font-size:20px">${n}</strong><div class="small ${label?'green':'muted'}">${label||'Temporada'}</div></div>`;}).join('');
 return head('Agenda anual','Calendário de 46 semanas','A temporada competitiva termina na semana 38. A segunda janela segue aberta durante a offseason até a semana 46.')+`<div class="grid stats">${stat('Semana atual',S.week+'/46','Ano '+S.seasonYear)}${stat('Temporada','1–38','Final na semana 38')}${stat('1ª janela','20–25','Meio da temporada','green')}${stat('2ª janela','38–46','Offseason','green')}</div><div class="card" style="margin-bottom:14px"><div class="row"><div><h2>${w.label}</h2><div class="muted small">${w.detail}</div></div><button class="primary" onclick="advanceWeek()">Avançar uma semana</button></div></div><div class="grid" style="grid-template-columns:repeat(6,minmax(0,1fr));gap:8px">${tiles}</div><div class="grid cols" style="margin-top:14px">${card('Marcos da temporada',`${row('Semanas 1–19','Temporada em andamento • mercado fechado')}${row('Semanas 20–25','Primeira janela de transferências')}${row('Semanas 26–37','Temporada em andamento • mercado fechado')}${row('Semana 38','Final da temporada e abertura da segunda janela')}${row('Semanas 39–46','Offseason • transferências abertas')}${row('Semana 1 do novo ano','Fechamento da janela e início da nova temporada')}`)}${card('Agenda da agência',`${row('Jogadores representados',S.clients.length)}${row('Propostas pendentes',S.transferOffers.filter(o=>o.status==='Em negociação').length)}${row('Transferências concluídas',S.transferOffers.filter(o=>o.status==='Concluída').length)}`)}</div>`;
}
function advanceWeek(){
 const old=S.week;
 if(old===38)log(`Semana 38: temporada ${S.seasonYear} encerrada. Segunda janela aberta.`);
 if(old===46){S.week=1;S.seasonYear++;S.year=S.seasonYear;log(`Ano ${S.seasonYear} iniciado. A janela de transferências fechou na semana 1.`);}else S.week++;
 if(S.week===20)log('Primeira janela de transferências aberta (semanas 20 a 25).');
 if(S.week===26)log('Primeira janela encerrada. Mercado fechado até a semana 38.');
 if(S.week===38)log('Temporada encerrada e segunda janela de transferências aberta (semanas 38 a 46).');
 if(S.week===1)log('Janela de transferências fechada. Nova temporada iniciada.');
 S.cash+=(S.income-S.expenses)/4;S.clients.forEach(p=>{p.relationship=Math.max(35,Math.min(100,(p.relationship||55)+(Math.random()>.35?1:-1)))});
 autoSave();render();toast(`Avançou para a semana ${S.week}.`);
}
function news(){return head('Central de informação','Notícias','Acompanhe os acontecimentos da sua agência e do mercado.')+card('Últimos acontecimentos',S.news.map(x=>`<div class="logline">▸ ${x}</div>`).join(''))}
function signPlayer(i){let p=S.scouted[i];if(!p)return;if(S.clients.some(x=>x.name===p.name))return toast('Este jogador já está representado.');let n={...p,fee:8,relationship:55,status:'Contrato ativo'};S.clients.push(n);S.scouted.splice(i,1);S.rep=Math.min(100,S.rep+2);log(`Contrato de representação assinado com ${p.name}.`);S.income+=.01;autoSave();render();toast(p.name+' agora faz parte do seu portfólio.')}
function releaseClient(i){let p=S.clients[i];if(!p)return;if(!confirm('Encerrar o contrato de representação de '+p.name+'?'))return;S.clients.splice(i,1);log(`Contrato de representação encerrado com ${p.name}.`);autoSave();render()}
function negotiateRenew(i){let p=S.clients[i];if(!p)return;p.fee=Math.min(15,p.fee+1);p.relationship=Math.min(100,p.relationship+8);p.status='Representação renovada';log(`Representação de ${p.name} renovada. Comissão ajustada para ${p.fee}%.`);autoSave();render();toast('Contrato de representação renovado.')}
function createDeal(){let p=S.clients[Number(document.getElementById('dealPlayer').value)];if(!p)return toast('Adicione jogadores ao portfólio primeiro.');let club=document.getElementById('dealClub').value,value=Number(document.getElementById('dealValue').value),fee=Number(document.getElementById('dealFee').value);if(value<=0||fee<1||fee>20)return toast('Confira os valores da proposta.');S.deals.unshift({id:Date.now(),player:p.name,club,value,fee,status:'Em análise'});log(`Proposta enviada por ${p.name}: ${club} ofereceu ${fmt(value)}.`);autoSave();render()}
function dealDecision(id,yes){let d=S.deals.find(x=>x.id===id);if(!d)return;d.status=yes?'Aceita':'Recusada';if(yes){let commission=d.value*d.fee/100;S.cash+=commission;S.income+=commission/12;S.rep=Math.min(100,S.rep+3);log(`Acordo aceito: ${d.player} negociado com ${d.club}. Comissão da agência: ${fmt(commission)}.`)}else log(`Proposta por ${d.player} recusada pela agência.`);autoSave();render()}
function saveAgency(){S.agency=document.getElementById('agencyName').value.trim()||'Minha Agência';S.agent=document.getElementById('agentName').value.trim()||'Empresário';log('Identidade da agência atualizada.');autoSave();render();toast('Dados da agência salvos.')}
function investAgency(){let n=Number(document.getElementById('investValue').value);if(n<=0||n>S.cash)return toast('Saldo insuficiente ou valor inválido.');S.cash-=n;S.rep=Math.min(100,S.rep+2);log(`Agência investiu ${fmt(n)} em observação de mercado e relacionamento.`);autoSave();render()}
function advanceMonth(){let net=S.income-S.expenses;S.cash+=net;S.month++;if(S.month>11){S.month=0;S.year++}S.clients.forEach(p=>{p.relationship=Math.max(35,Math.min(100,p.relationship+(Math.random()>.35?2:-1))) });log(`Relatório mensal: ${net>=0?'resultado positivo':'resultado negativo'} de ${fmt(net)}.`);autoSave();render()}
render();
</script></body></html>
