<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Career Agent — Pacote Jogável 01</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--panel2:#192740;--line:#2a3b57;--text:#eef4ff;--muted:#9eafc8;--accent:#42c58a;--blue:#6aa8ff;--red:#ff7474;--gold:#e8bd63}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:#20324d;color:var(--text);font-weight:650}button:hover{filter:brightness(1.15)}button.primary{background:var(--accent);color:#071b13;border-color:var(--accent)}button.danger{background:#492a36;border-color:#75404c}button:disabled{opacity:.45;cursor:not-allowed}
.app{max-width:1450px;margin:auto;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);background:#0e192a;position:sticky;top:0;z-index:4}.brand{font-size:20px;font-weight:900;letter-spacing:.08em}.brand span{color:var(--accent)}.topmeta{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 67px)}aside{padding:18px 12px;border-right:1px solid var(--line);background:#0e192a}.navgroup{font-size:11px;color:#7488a6;text-transform:uppercase;letter-spacing:.12em;padding:12px 10px 6px}.nav{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border-color:transparent;color:#b9c8dd;margin:2px 0}.nav.active{background:#1c3049;border-color:#365273;color:white}.nav .ico{width:20px;text-align:center}.main{padding:24px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{font-size:27px;margin:3px 0 5px}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.cols{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px;min-width:0}.statlabel{font-size:12px;color:var(--muted)}.statvalue{font-size:25px;font-weight:850;margin-top:4px}.green{color:var(--accent)}.gold{color:var(--gold)}.red{color:var(--red)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.stack{display:grid;gap:11px}.divider{height:1px;background:var(--line);margin:12px 0}
label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}input,select{width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:#0c1728;color:var(--text);outline:none}input:focus,select:focus{border-color:var(--blue)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;padding:4px 8px;border-radius:20px;background:#203b37;color:#9ce8c5;font-size:11px;font-weight:750}.pill.warn{background:#443922;color:#f1d28b}.pill.bad{background:#492a36;color:#ffabab}.bar{height:8px;background:#27364e;border-radius:20px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);border-radius:20px}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #26364e}.item:last-child{border:0}.log{max-height:260px;overflow:auto}.logline{padding:8px 0;border-bottom:1px solid #26364e;font-size:13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:650}.notice{border-left:3px solid var(--gold);padding:9px 12px;background:#20283a;border-radius:7px;color:#d9e3f3;font-size:13px}.empty{padding:22px;text-align:center;color:var(--muted)}
.mainmenu{min-height:calc(100vh - 150px);display:grid;place-items:center;background:radial-gradient(ellipse at 50% 15%,#1b3550 0%,#0b1220 62%);padding:28px}.menuwrap{width:min(760px,100%);text-align:center}.menulogo{font-size:clamp(38px,8vw,68px);font-weight:950;letter-spacing:.09em;margin:8px 0}.menulogo span{color:var(--accent)}.menusub{color:var(--muted);letter-spacing:.18em;text-transform:uppercase;font-size:11px}.menucard{margin:28px auto 0;max-width:430px;background:#121d30eF;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:left;box-shadow:0 24px 70px #0006}.menucard button{width:100%;margin-top:10px;padding:13px}.menufoot{margin-top:20px;color:#8193ad;font-size:12px}.teamgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}.teamcard{background:#121d30;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left}.teamcard h3{font-size:17px;margin:8px 0}.teamcard .teammeta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:7px 0}.teamcard button{width:100%;margin-top:12px}.menuactions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}@media(max-width:850px){.teamgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.teamgrid{grid-template-columns:1fr}}.mobilebar{display:none}.footer{padding:18px 24px;color:#7587a3;font-size:11px;border-top:1px solid var(--line)}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:5px;position:sticky;top:65px;z-index:3}.navgroup{display:none}.nav{white-space:nowrap;width:auto;margin:0;padding:9px}.main{padding:16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cols,.three{grid-template-columns:1fr}.top{padding:14px}.topmeta{gap:7px}.topmeta .hide{display:none}}
@media(max-width:480px){.statvalue{font-size:21px}.formgrid{grid-template-columns:1fr}.pagehead{display:block}.pagehead .actions{margin-top:12px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">CAREER <span>AGENT</span></div><div class="topmeta"><span id="dateTop">Temporada 2026 • Janeiro</span><span class="hide" id="saveStatus">Salvamento local ativo</span><button id="homeButton" onclick="returnMainMenu()" style="display:none">⌂ Menu principal</button><button id="saveButton" onclick="saveGame()">Salvar</button></div></header>
<div class="layout">
<aside id="nav"></aside>
<main class="main" id="main"></main>
</div>
<div class="footer">PACOTE 01 • Protótipo jogável local • Dados fictícios • Salva automaticamente neste navegador</div>
</div>
<script>
const fmt=n=>'€ '+Number(n).toFixed(1)+' mi';
const initial=()=>({
 page:'dashboard',day:1,month:0,year:2026, cash:80,debt:5,clubValue:45,stake:100,club:'Atlético Aurora',
 owner:true,ceo:'Roberto Martins',ceoQuality:55,coach:'Eduardo Nascimento',coachRating:62,
 revenue:4.5,cost:4.0,sport:55,morale:70,reputation:18,transferBudget:8,
 goal:'Aumentar o valor de mercado do clube',target:'Classificar para competição continental',
 projects:[],news:['Você assumiu o controle acionário do Atlético Aurora.','A diretoria iniciou a transição administrativa.'],
 log:['Aquisição concluída: 100% do Atlético Aurora.'],staff:[{role:'CEO',name:'Roberto Martins',salary:.25},{role:'Diretor de futebol',name:'André Carvalho',salary:.18},{role:'Diretor financeiro',name:'Paulo Mendes',salary:.16}],
 players:[{name:'Lucas Ferreira',pos:'ATA',age:23,rating:76,value:8.5,salary:.12},{name:'Gabriel Costa',pos:'MEI',age:25,rating:79,value:11,salary:.16},{name:'Matheus Silva',pos:'ZAG',age:28,rating:73,value:5.5,salary:.10},{name:'Rafael Mendes',pos:'GOL',age:24,rating:75,value:6,salary:.09}],
 transferOffers:[],sponsors:[{name:'Nexa Sports',value:1.2,months:6}],calendar:[],seasonMatches:0,wins:0,draws:0,losses:0,championshipPoints:0
});
function loadGame(){
 try {
  const saved=JSON.parse(localStorage.getItem('careerAgentSave'));
  // Remove o save antigo de demonstração do Atlético Aurora uma única vez.
  if(saved && String(saved.club||'').trim().toLowerCase()==='atlético aurora'){
   localStorage.removeItem('careerAgentSave');
   return null;
  }
  return saved;
 } catch(e){ localStorage.removeItem('careerAgentSave'); return null; }
}
let savedCareer=loadGame();
let S=savedCareer||initial();
S.page='mainmenu';
function saveGame(){localStorage.setItem('careerAgentSave',JSON.stringify(S));savedCareer={...S};document.getElementById('saveStatus').textContent='Salvo às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});toast('Carreira salva neste navegador.')}
function autoSave(){localStorage.setItem('careerAgentSave',JSON.stringify(S));savedCareer={...S};}
function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;bottom:20px;right:20px;background:#203b37;border:1px solid #42c58a;padding:12px 16px;border-radius:10px;z-index:10;color:white;box-shadow:0 8px 30px #0008';document.body.appendChild(el)}el.textContent=msg;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2500)}
function log(msg){S.log.unshift(msg);S.log=S.log.slice(0,30);S.news.unshift(msg);S.news=S.news.slice(0,20)}
const clubs=[
 {name:'União Metropolitana',city:'Rio de Janeiro',league:'1ª divisão',sport:72,cash:80,debt:5,value:45,rep:58,coach:'Eduardo Nascimento',ceo:'Roberto Martins',difficulty:'Equilibrado'},
 {name:'Atlético do Vale',city:'São Paulo',league:'1ª divisão',sport:84,cash:115,debt:28,value:92,rep:76,coach:'Marcelo Vieira',ceo:'Ricardo Almeida',difficulty:'Desafiador'},
 {name:'Porto Dourado',city:'Porto Alegre',league:'1ª divisão',sport:78,cash:62,debt:12,value:68,rep:67,coach:'André Ribeiro',ceo:'Paulo Mendes',difficulty:'Equilibrado'},
 {name:'Real do Cerrado',city:'Brasília',league:'2ª divisão',sport:63,cash:35,debt:3,value:24,rep:42,coach:'Fernando Lopes',ceo:'Carlos Nogueira',difficulty:'Em reconstrução'},
 {name:'Estrela do Norte',city:'Manaus',league:'2ª divisão',sport:58,cash:22,debt:1,value:16,rep:35,coach:'Lucas Barros',ceo:'Marcos Silva',difficulty:'Projeto de longo prazo'},
 {name:'Ferroviário Central',city:'Belo Horizonte',league:'2ª divisão',sport:68,cash:41,debt:18,value:31,rep:48,coach:'Daniel Costa',ceo:'André Carvalho',difficulty:'Finanças pressionadas'}
];
const navItems=[['dashboard','⌂','Visão geral','CLUBE'],['board','♙','Diretoria'],['sport','⚽','Departamento de futebol'],['squad','♧','Elenco'],['transfers','⇄','Mercado de transferências'],['invest','▦','Investimentos','GESTÃO'],['finance','€','Finanças'],['strategy','◎','Estratégia'],['ownership','♢','Propriedade'],['calendar','▦','Calendário'],['news','▤','Notícias'],['history','◷','Histórico']];
function renderNav(){document.getElementById('nav').innerHTML=navItems.map((n,i)=>(n[3]?`<div class="navgroup">${n[3]}</div>`:'')+`<button class="nav ${S.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span>${n[2]}</button>`).join('')}
function go(p){S.page=p;render()}
function head(kicker,title,desc,extra=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><div class="muted">${desc}</div></div>${extra}</div>`}
function stat(label,value,sub='',color=''){return `<div class="card"><div class="statlabel">${label}</div><div class="statvalue ${color}">${value}</div>${sub?`<div class="muted small">${sub}</div>`:''}</div>`}
function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function row(a,b){return `<div class="item"><span class="muted">${a}</span><strong>${b}</strong></div>`}
function render(){
 const aside=document.getElementById('nav');
 const main=document.getElementById('main');
 const topSave=document.getElementById('saveButton');
 const homeButton=document.getElementById('homeButton');
 const names=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
 if(S.page==='mainmenu'){
  aside.style.display='none';
  document.querySelector('.layout').style.gridTemplateColumns='1fr';
  document.getElementById('dateTop').textContent='Sua próxima carreira começa aqui';
  document.getElementById('saveStatus').textContent=savedCareer?'Carreira encontrada':'Nenhuma carreira salva';
  if(topSave) topSave.style.display='none';
  if(homeButton) homeButton.style.display='none';
  main.innerHTML=mainMenu();
  return;
 }
 if(S.page==='teamselect'){
  aside.style.display='none'; document.querySelector('.layout').style.gridTemplateColumns='1fr';
  document.getElementById('dateTop').textContent='Nova carreira • Escolha seu clube';
  if(topSave) topSave.style.display='none'; if(homeButton) homeButton.style.display='none';
  main.innerHTML=teamSelection(); return;
 }
 aside.style.display='';
 document.querySelector('.layout').style.gridTemplateColumns='';
 if(topSave) topSave.style.display='';
 if(homeButton) homeButton.style.display='';
 renderNav();
 document.getElementById('dateTop').textContent=`Temporada ${S.year} • ${names[S.month]}`;
 const pages={dashboard:dashboard,board:board,sport:sport,squad:squad,transfers:transfers,invest:invest,finance:finance,strategy:strategy,ownership:ownership,calendar:calendar,news:news,history:history};
 main.innerHTML=(pages[S.page]||dashboard)();
}
function mainMenu(){
 const has=!!savedCareer;
 return `<div class="mainmenu"><div class="menuwrap"><div class="menusub">Simulador de gestão do futebol</div><div class="menulogo">CAREER <span>AGENT</span></div><div class="muted">Construa seu império no futebol.</div><div class="menucard"><div class="eyebrow">Menu principal</div><h2 style="font-size:23px;margin:5px 0 3px">Bem-vindo, proprietário</h2><div class="muted small">Escolha como deseja continuar.</div><button class="primary" onclick="startNewCareer()">Nova carreira</button><button ${has?'':'disabled'} onclick="continueCareer()">Continuar carreira${has?' — '+(savedCareer.club||'Meu clube'):''}</button><button onclick="showAbout()">Sobre o jogo</button>${has?'<button class="danger" onclick="deleteCareer()">Excluir carreira salva</button>':''}</div><div class="menufoot">PACOTE JOGÁVEL 01 • Protótipo local</div></div></div>`;
}
function startNewCareer(){S=initial();S.page='teamselect';savedCareer=null;render();}
function teamSelection(){return `<div class="mainmenu"><div class="menuwrap" style="width:min(1100px,100%)"><div class="menusub">Nova carreira • Etapa 1</div><div class="menulogo" style="font-size:clamp(32px,6vw,54px)">ESCOLHA SEU <span>CLUBE</span></div><div class="muted">Selecione o time que você deseja comprar e administrar como proprietário-investidor.</div><div class="teamgrid">${clubs.map((c,i)=>`<div class="teamcard"><div class="eyebrow">${c.league}</div><h3>${c.name}</h3><div class="muted small">${c.city}</div><div class="teammeta"><span>Força esportiva</span><strong>${c.sport}/100</strong></div><div class="teammeta"><span>Valor estimado</span><strong>${fmt(c.value)}</strong></div><div class="teammeta"><span>Caixa inicial</span><strong>${fmt(c.cash)}</strong></div><div class="teammeta"><span>Perfil</span><strong>${c.difficulty}</strong></div><button class="primary" onclick="selectTeam(${i})">Escolher este clube</button></div>`).join('')}</div><div class="menuactions"><button onclick="returnMainMenu()">← Voltar ao menu principal</button></div></div></div>`;}
function selectTeam(i){const c=clubs[i];if(!c)return;S=initial();S.club=c.name;S.sport=c.sport;S.cash=c.cash;S.debt=c.debt;S.clubValue=c.value;S.reputation=c.rep;S.coach=c.coach;S.ceo=c.ceo;S.staff=[{role:'CEO',name:c.ceo,salary:.25},{role:'Diretor de futebol',name:'André Carvalho',salary:.18},{role:'Diretor financeiro',name:'Paulo Mendes',salary:.16}];S.news=[`Você assumiu o controle do ${c.name}.`,`A diretoria iniciou a transição administrativa.`];S.log=[`Nova carreira iniciada: ${c.name}.`];S.page='dashboard';autoSave();render();toast(`${c.name} selecionado!`);}
function returnMainMenu(){if(S.page!=='mainmenu'&&S.page!=='teamselect')autoSave();S.page='mainmenu';render();}
function continueCareer(){if(!savedCareer)return;S={...initial(),...savedCareer,page:'dashboard'};render();}
function deleteCareer(){if(!confirm('Excluir definitivamente a carreira salva neste navegador?'))return;localStorage.removeItem('careerAgentSave');savedCareer=null;S=initial();S.page='mainmenu';render();toast('Carreira salva excluída.');}
function showAbout(){alert('Career Agent — Pacote Jogável 01\nProtótipo de gestão de um clube de futebol. Dados fictícios e salvamento local no navegador.');}
function dashboard(){return head('Painel do proprietário',''+S.club,'Você é o dono e investidor. A diretoria executa as operações diárias.',`<div class="actions"><button class="primary" onclick="advanceMonth()">Avançar mês</button></div>`)+
`<div class="grid stats">${stat('Participação',S.stake+'%','Controle acionário')}${stat('Valor estimado',fmt(S.clubValue),'Avaliação simulada','green')}${stat('Caixa do clube',fmt(S.cash),'Disponibilidade')}${stat('Dívidas',fmt(S.debt),'Obrigações financeiras',S.debt>15?'red':'')}</div>
<div class="grid cols">${card('Indicadores do clube',`<div class="stack">${row('Força esportiva',S.sport+'/100')}<div class="bar"><i style="width:${S.sport}%"></i></div>${row('Satisfação interna',S.morale+'/100')}<div class="bar"><i style="width:${S.morale}%"></i></div>${row('Reputação do proprietário',S.reputation+'/100')}${row('Diretor executivo',S.ceo)}${row('Treinador',S.coach)}</div>`)}
${card('Resumo financeiro do mês',`${row('Receitas',fmt(S.revenue))}${row('Despesas',fmt(S.cost))}${row('Resultado operacional',`<span class="${S.revenue>=S.cost?'green':'red'}">${fmt(S.revenue-S.cost)}</span>`)}<div class="divider"></div><div class="notice">Objetivo: ${S.goal}<br>Meta esportiva: ${S.target}</div>`)}</div>
<div class="grid cols" style="margin-top:14px">${card('Últimas notícias',`<div class="list">${S.news.slice(0,5).map(x=>`<div class="logline">${x}</div>`).join('')}</div>`)}${card('Ações rápidas',`<div class="stack"><button onclick="go('board')">Administrar diretoria</button><button onclick="go('invest')">Aprovar investimento</button><button onclick="go('transfers')">Abrir mercado</button><button onclick="go('finance')">Consultar finanças</button></div>`)}</div>`}
function board(){return head('Governança','Diretoria executiva','Nomeie dirigentes e delegue a gestão cotidiana.')+
`<div class="grid cols">${card('Estrutura atual',`<div class="list">${S.staff.map((p,i)=>`<div class="item"><div><strong>${p.role}</strong><div class="muted small">${p.name} • ${fmt(p.salary)}/mês</div></div>${i===0?'<span class="pill">CEO</span>':`<button onclick="dismissStaff(${i})" class="danger">Demitir</button>`}</div>`).join('')}</div>`)}
${card('Contratar dirigente',`<div class="stack"><div><label>Cargo</label><select id="newRole"><option>CEO</option><option>Diretor de futebol</option><option>Diretor financeiro</option><option>Diretor comercial</option><option>Diretor jurídico</option></select></div><div><label>Nome</label><input id="newName" value="Novo dirigente"></div><div><label>Salário mensal (€ mi)</label><input id="newSalary" type="number" min=".01" step=".01" value=".15"></div><button class="primary" onclick="hireStaff()">Contratar dirigente</button><p class="muted small">Salários são incorporados às despesas na próxima virada de mês.</p></div>`)}</div>
<div class="notice" style="margin-top:14px">Como proprietário, você define a estratégia e escolhe a liderança. A diretoria administra as atividades operacionais e presta contas.</div>`}
function sport(){return head('Gestão esportiva','Departamento de futebol','Você aprova o orçamento e cobra resultados; o diretor de futebol conduz a operação.')+
`<div class="grid three">${stat('Treinador',S.coach,'Comissão técnica')}${stat('Força do elenco',S.sport+'/100','Índice esportivo')}${stat('Orçamento disponível',fmt(S.transferBudget),'Mercado de jogadores')}</div>
<div class="grid cols" style="margin-top:14px">${card('Comissão técnica',`<div class="stack"><div>${row('Treinador atual',S.coach)}${row('Avaliação',S.coachRating+'/100')}</div><label>Escolher treinador</label><select id="coachSelect"><option>Eduardo Nascimento</option><option>Marcelo Vieira</option><option>André Ribeiro</option><option>Fernando Lopes</option></select><button onclick="changeCoach()">Nomear treinador</button></div>`)}
${card('Orçamento esportivo',`<div class="stack"><label>Valor a liberar (€ mi)</label><input id="sportsBudget" type="number" min="0" step=".5" value="3"><button class="primary" onclick="releaseSportsBudget()">Liberar orçamento ao departamento</button><p class="muted small">O valor sai do caixa geral e passa ao orçamento esportivo.</p></div>`)}</div>`}
function squad(){return head('Elenco profissional','Jogadores','Consulte o elenco e decida sobre renovações e vendas.')+
`<div class="card tablewrap"><table><thead><tr><th>Jogador</th><th>Posição</th><th>Idade</th><th>Nível</th><th>Valor</th><th>Salário/mês</th><th></th></tr></thead><tbody>${S.players.map((p,i)=>`<tr><td><strong>${p.name}</strong></td><td>${p.pos}</td><td>${p.age}</td><td>${p.rating}</td><td>${fmt(p.value)}</td><td>${fmt(p.salary)}</td><td><button onclick="sellPlayer(${i})">Vender</button></td></tr>`).join('')}</tbody></table></div>
<div class="notice" style="margin-top:14px">As vendas geram receita e reduzem a força esportiva. As contratações serão ampliadas na próxima versão.</div>`}
function transfers(){return head('Mercado','Transferências','Faça ofertas simuladas por jogadores para reforçar o elenco.')+
`<div class="grid cols">${card('Jogadores disponíveis',`<div class="list">${[['Thiago Oliveira','ATA',24,7.5,74],['Bruno Lima','VOL',26,5.0,72],['Caio Santos','ZAG',22,9.0,77]].map((p,i)=>`<div class="item"><div><strong>${p[0]}</strong><div class="muted small">${p[1]} • ${p[2]} anos • nível ${p[4]}</div></div><div class="stack"><strong>${fmt(p[3])}</strong><button onclick="buyPlayer(${i})">Ofertar</button></div></div>`).join('')}</div>`)}
${card('Propostas recentes',S.transferOffers.length?S.transferOffers.map(x=>`<div class="logline">${x}</div>`).join(''):'<div class="empty">Nenhuma proposta enviada.</div>')}</div>`}
function invest(){return head('Capital e patrimônio','Investimentos','Aprove projetos que aumentem a estrutura e o valor do clube.')+
`<div class="grid stats">${stat('Caixa disponível',fmt(S.cash))}${stat('Valor do clube',fmt(S.clubValue))}${stat('Projetos concluídos',S.projects.length)}${stat('Dívidas',fmt(S.debt))}</div>
<div class="grid three">${[['Centro de treinamento',8,9],['Categorias de base',5,7],['Estádio',15,12],['Departamento médico',4,5],['Tecnologia e análise',3,4]].map((p,i)=>card(p[0],`<p class="muted small">${['Modernização do centro de treinamento.','Formação de jovens talentos.','Reforma e expansão de instalações.','Equipamentos e profissionais especializados.','Dados e análise de desempenho.'][i]}</p><div class="row"><span class="muted small">Custo</span><strong>${fmt(p[1])}</strong></div><div class="row"><span class="muted small">Impacto estrutural</span><strong>+${p[2]}</strong></div><button style="width:100%;margin-top:12px" ${S.cash<p[1]?'disabled':''} onclick="investProject('${p[0]}',${p[1]},${p[2]})">Aprovar projeto</button>`)).join('')}</div>
<div class="card" style="margin-top:14px"><h2>Projetos realizados</h2>${S.projects.length?S.projects.map(p=>`<div class="item">${p}</div>`).join(''):'<div class="empty">Nenhum projeto realizado.</div>'}</div>`}
function finance(){return head('Gestão financeira','Finanças','Acompanhe o caixa, o endividamento e a rentabilidade.')+
`<div class="grid stats">${stat('Caixa',fmt(S.cash),'Recursos disponíveis')}${stat('Dívida',fmt(S.debt),'Passivos')}${stat('Receita mensal',fmt(S.revenue))}${stat('Despesa mensal',fmt(S.cost))}</div>
<div class="grid cols">${card('Fluxo mensal',`${row('Receitas',fmt(S.revenue))}${row('Despesas',fmt(S.cost))}${row('Resultado',`<strong class="${S.revenue>=S.cost?'green':'red'}">${fmt(S.revenue-S.cost)}</strong>`)}${row('Valor patrimonial líquido',fmt(S.clubValue-S.debt))}`)}
${card('Operações de capital',`<div class="stack"><label>Injetar capital próprio (€ mi)</label><input id="capitalInput" type="number" min=".1" step=".1" value="5"><button class="primary" onclick="injectCapital()">Injetar capital</button><div class="divider"></div><label>Amortizar dívida (€ mi)</label><input id="debtInput" type="number" min=".1" step=".1" value="2"><button onclick="payDebt()">Pagar dívida</button><div class="divider"></div><label>Patrocínio adicional (€ mi/mês)</label><input id="sponsorInput" type="number" min=".1" step=".1" value=".5"><button onclick="addSponsor()">Negociar patrocínio simulado</button></div>`)}</div>`}
function strategy(){return head('Planejamento','Estratégia do proprietário','Defina a direção do clube e as metas da administração.')+
`<div class="grid cols">${card('Objetivo empresarial',`<label>Prioridade estratégica</label><select id="goalSelect"><option>Aumentar o valor de mercado do clube</option><option>Conquistar títulos</option><option>Equilibrar as finanças</option><option>Desenvolver categorias de base</option><option>Expandir internacionalmente</option></select><label style="margin-top:12px">Meta esportiva</label><select id="targetSelect"><option>Evitar rebaixamento</option><option>Terminar na metade superior da tabela</option><option>Classificar para competição continental</option><option>Conquistar campeonato</option></select><button class="primary" style="margin-top:14px" onclick="setStrategy()">Publicar diretrizes</button>`)}
${card('Poderes do proprietário',`<div class="list">${['Nomear e demitir CEO','Aprovar orçamento anual','Aprovar grandes investimentos','Definir metas e estratégia','Injetar capital e negociar dívida','Vender participação societária'].map(x=>`<div class="item">${x}<span class="pill">Disponível</span></div>`).join('')}</div>`)}</div>`}
function ownership(){return head('Sociedade','Propriedade e investidores','Controle sua participação e negocie a entrada de novos sócios.')+
`<div class="grid cols">${card('Estrutura acionária',`${row('Sua participação',S.stake+'%')}${row('Valor estimado da sua participação',fmt(S.clubValue*S.stake/100))}${row('Valor total do clube',fmt(S.clubValue))}<div class="divider"></div><label>Percentual para vender</label><input id="stakeSale" type="number" min="1" max="${Math.max(1,S.stake-1)}" value="10"><button class="primary" style="margin-top:10px" onclick="sellStake()">Negociar venda de participação</button><p class="muted small">A venda é simulada pelo valor proporcional da avaliação atual.</p>`)}
${card('Entrada de investidor',`<label>Capital oferecido (€ mi)</label><input id="investorCash" type="number" min=".1" step=".1" value="10"><label style="margin-top:10px">Participação solicitada (%)</label><input id="investorStake" type="number" min="1" max="99" value="15"><button style="margin-top:10px" onclick="newInvestor()">Avaliar proposta</button><div class="notice" style="margin-top:12px">A entrada de um investidor dilui sua participação. Avalie o capital recebido e o poder de decisão cedido.</div>`)}</div>`}
function calendar(){return head('Temporada','Calendário e evolução','Avance o calendário mensal para processar as operações do clube.')+
`<div class="grid cols">${card('Calendário',`<div class="statvalue">${['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][S.month]} ${S.year}</div><p class="muted">Mês ${S.month+1} da temporada</p><button class="primary" onclick="advanceMonth()">Avançar um mês</button><p class="muted small">O avanço processa receitas, despesas, folha salarial, satisfação e desempenho.</p>`)}
${card('Histórico esportivo',`${row('Jogos simulados',S.seasonMatches)}${row('Vitórias',S.wins)}${row('Empates',S.draws)}${row('Derrotas',S.losses)}${row('Pontos',S.championshipPoints)}`)}</div>`}
function news(){return head('Comunicação','Notícias do clube','Acompanhe os acontecimentos da instituição.')+card('Jornal do clube',S.news.map(n=>`<div class="logline">▸ ${n}</div>`).join(''))}
function history(){return head('Arquivo','Histórico da carreira','Registro das decisões tomadas pelo proprietário.')+card('Livro de registros',S.log.map((n,i)=>`<div class="logline"><span class="muted">${String(S.log.length-i).padStart(2,'0')}.</span> ${n}</div>`).join(''))}
function hireStaff(){let role=document.getElementById('newRole').value,name=document.getElementById('newName').value.trim(),salary=Number(document.getElementById('newSalary').value);if(!name||salary<=0)return toast('Preencha nome e salário válido.');if(S.cash<salary*2)return toast('Caixa insuficiente para contratar.');S.staff.push({role,name,salary});S.cost+=salary;log(`${role} ${name} contratado.`);render()}
function dismissStaff(i){let p=S.staff[i];if(!p)return;S.staff.splice(i,1);S.cost=Math.max(.5,S.cost-p.salary);log(`${p.role} ${p.name} foi desligado.`);render()}
function changeCoach(){S.coach=document.getElementById('coachSelect').value;S.coachRating=60+Math.floor(Math.random()*20);S.morale=Math.max(0,S.morale-3);log(`Você nomeou ${S.coach} como treinador principal.`);render()}
function releaseSportsBudget(){let n=Number(document.getElementById('sportsBudget').value);if(n<=0||n>S.cash)return toast('Valor inválido ou caixa insuficiente.');S.cash-=n;S.transferBudget+=n;log(`${fmt(n)} liberados ao departamento de futebol.`);render()}
function investProject(name,cost,impact){if(S.cash<cost)return;S.cash-=cost;S.projects.push(name);S.clubValue+=impact*.35;S.sport=Math.min(100,S.sport+Math.round(impact/5));log(`Investimento aprovado: ${name}, custo ${fmt(cost)}.`);render()}
function injectCapital(){let n=Number(document.getElementById('capitalInput').value);if(n<=0)return;S.cash+=n;log(`Proprietário injetou ${fmt(n)} de capital próprio.`);render()}
function payDebt(){let n=Number(document.getElementById('debtInput').value);if(n<=0||n>S.cash||n>S.debt)return toast('Valor inválido, caixa insuficiente ou dívida menor.');S.cash-=n;S.debt-=n;log(`Clube amortizou ${fmt(n)} em dívidas.`);render()}
function addSponsor(){let n=Number(document.getElementById('sponsorInput').value);if(n<=0)return;S.revenue+=n;S.clubValue+=n*2;log(`Novo patrocínio negociado: ${fmt(n)} adicionais por mês.`);render()}
function setStrategy(){S.goal=document.getElementById('goalSelect').value;S.target=document.getElementById('targetSelect').value;log(`Estratégia definida: ${S.goal}. Meta esportiva: ${S.target}.`);render()}
function sellStake(){let n=Number(document.getElementById('stakeSale').value);if(n<=0||n>=S.stake)return toast('Percentual inválido: mantenha ao menos uma ação.');let proceeds=S.clubValue*n/100;S.stake-=n;S.cash+=proceeds;S.reputation=Math.max(0,S.reputation-1);log(`Venda simulada de ${n}% da participação por ${fmt(proceeds)}.`);render()}
function newInvestor(){let c=Number(document.getElementById('investorCash').value),p=Number(document.getElementById('investorStake').value);if(c<=0||p<=0||p>=S.stake)return toast('Condições inválidas.');let implied=c/(p/100);if(implied<S.clubValue*.75)return toast('Oferta muito baixa para a avaliação atual.');S.cash+=c;S.stake-=p;S.clubValue=Math.max(S.clubValue,implied);log(`Novo investidor aportou ${fmt(c)} por ${p}% de participação.`);render()}
function buyPlayer(i){let p=[{name:'Thiago Oliveira',pos:'ATA',age:24,rating:74,value:7.5,salary:.11},{name:'Bruno Lima',pos:'VOL',age:26,rating:72,value:5,salary:.08},{name:'Caio Santos',pos:'ZAG',age:22,rating:77,value:9,salary:.13}][i];if(S.transferBudget<p.value)return toast('Orçamento de transferências insuficiente.');S.transferBudget-=p.value;S.players.push(p);S.sport=Math.min(100,S.sport+2);S.cost+=p.salary;S.transferOffers.unshift(`Contratação concluída: ${p.name} por ${fmt(p.value)}.`);log(`Clube contratou ${p.name}.`);render()}
function sellPlayer(i){let p=S.players[i];if(!p)return;let fee=p.value*.9;S.players.splice(i,1);S.cash+=fee;S.sport=Math.max(1,S.sport-2);S.cost=Math.max(.5,S.cost-p.salary);log(`${p.name} vendido por ${fmt(fee)}.`);render()}
function advanceMonth(){let salary=S.staff.reduce((a,p)=>a+p.salary,0),monthly=S.revenue-S.cost;S.cash+=monthly;S.debt=Math.max(0,S.debt+(monthly<0?Math.abs(monthly)*.25:0));S.morale=Math.max(0,Math.min(100,S.morale+(monthly>=0?2:-4)));let performance=S.sport+S.coachRating-100;let win=Math.random()<Math.max(.25,Math.min(.75,.5+performance/250));S.seasonMatches++;if(win){S.wins++;S.championshipPoints+=3;S.sport=Math.min(100,S.sport+1)}else if(Math.random()<.45){S.draws++;S.championshipPoints++}else{S.losses++;S.sport=Math.max(1,S.sport-1)}
S.clubValue=Math.max(5,S.clubValue+(monthly>=0?.35:-.25)+(win?.35:-.1));S.reputation=Math.max(0,Math.min(100,S.reputation+(win?1:0)));S.month++;if(S.month>=12){S.month=0;S.year++;log(`Temporada ${S.year-1} encerrada: ${S.wins} vitórias, ${S.draws} empates e ${S.losses} derrotas.`);S.wins=0;S.draws=0;S.losses=0;S.seasonMatches=0;S.championshipPoints=0}
log(`Relatório mensal: resultado ${monthly>=0?'+':''}${fmt(monthly)}. ${win?'Vitória no jogo do mês.':'A equipe não venceu o jogo do mês.'}`);autoSave();render()}
function resetGame(){if(confirm('Apagar a carreira salva e começar novamente?')){localStorage.removeItem('careerAgentSave');savedCareer=null;S=initial();S.page='mainmenu';render()}}
render();
</script>
</body>
</html>
