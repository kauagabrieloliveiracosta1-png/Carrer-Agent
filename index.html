<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Agent — Manager V0.1</title><style>
:root{--bg:#09111d;--panel:#111d2c;--panel2:#172638;--line:#293b50;--txt:#eef5fb;--muted:#91a4b9;--green:#35c58b;--gold:#e6bd68;--red:#ef7777}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1b3548,#09111d 55%);color:var(--txt);font:14px/1.45 Inter,system-ui,Arial}.wrap{max-width:1440px;margin:auto;min-height:100vh}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0b1725;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{font-weight:950;letter-spacing:.12em;font-size:19px}.brand b{color:var(--green)}.meta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 66px)}aside{background:#0c1826;border-right:1px solid var(--line);padding:17px 12px}.group{font-size:10px;color:#6f849a;letter-spacing:.16em;padding:13px 10px 6px;font-weight:800}.nav{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;color:#b8c7d6;padding:11px;border-radius:9px;margin:2px 0}.nav.active{background:#1b3040;border-color:#31566a;color:#fff}.nav i{width:20px;font-style:normal}.main{padding:24px;min-width:0}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.eyebrow{color:var(--green);font-weight:850;font-size:10px;letter-spacing:.16em;text-transform:uppercase}h1{font-size:27px;margin:3px 0 4px}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:11px}.grid{display:grid;gap:13px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.cols{grid-template-columns:1.15fr .85fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:linear-gradient(145deg,#142437,#101b29);border:1px solid var(--line);border-radius:13px;padding:16px;min-width:0}.statlabel{font-size:11px;color:var(--muted)}.stat{font-size:24px;font-weight:900;margin-top:4px}.green{color:var(--green)}.gold{color:var(--gold)}button,select{font:inherit}button{cursor:pointer;border:1px solid #35516a;border-radius:8px;padding:9px 12px;background:#1c3043;color:var(--txt);font-weight:700}button:hover{filter:brightness(1.15)}button.primary{background:var(--green);border-color:var(--green);color:#061b13}button:disabled{opacity:.4}select{background:#0b1724;color:var(--txt);border:1px solid var(--line);padding:9px;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #26394b}.row:last-child{border:0}.bar{height:7px;background:#26394b;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green)}.pitch{background:linear-gradient(145deg,#176246,#0d4939);border:1px solid #267657;border-radius:12px;padding:15px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;min-height:310px}.slot{background:#0b2b23aa;border:1px solid #72c8a277;border-radius:8px;padding:9px 4px;text-align:center;min-height:61px}.slot b{display:block;font-size:12px}.slot small{color:#c0e5d2}.player{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #26394b}.ovr{font-weight:900;color:var(--gold)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid #293b50}th{color:var(--muted);font-size:10px;letter-spacing:.06em}tr.me{background:#1c3c35}.rank{color:var(--muted);width:25px}.club{font-weight:750}.tag{font-size:10px;color:var(--green);background:#173d32;padding:3px 6px;border-radius:20px}.feed{padding:9px 0;border-bottom:1px solid #293b50;font-size:12px}.screen{max-width:650px;margin:9vh auto;padding:25px}.hero{padding:24px;border-radius:15px;background:linear-gradient(115deg,#102d3a,#142338 65%,#183b32);border:1px solid #2a5260}.hero h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.04em}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.formrow label{font-size:11px;color:var(--muted)}.formrow select{width:100%;margin-top:5px}.footer{text-align:center;color:#64798e;padding:18px;font-size:10px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;position:sticky;top:66px;z-index:4;padding:7px;gap:4px}.group{display:none}.nav{white-space:nowrap;width:auto;padding:9px}.main{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.cols,.three{grid-template-columns:1fr}.top{padding:0 13px}.meta .hide{display:none}}@media(max-width:520px){.formrow{grid-template-columns:1fr}.head{display:block}.head .actions{margin-top:10px}.stat{font-size:20px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">CAREER <b>AGENT</b> <span class="tag">MANAGER V0.1</span></div><div class="meta"><span id="seasonTop">Temporada 2027</span><button onclick="save()">Salvar</button></div></header><div id="root"></div><div class="footer">CAREER AGENT MANAGER • V0.1 TESTE • PROTÓTIPO LOCAL • DADOS E ELENCOS DEMONSTRATIVOS</div></div><script>
const clubs=['Athletico-PR','Atlético-MG','Bahia','Botafogo','Chapecoense','Corinthians','Coritiba','Cruzeiro','Flamengo','Fluminense','Grêmio','Internacional','Mirassol','Palmeiras','Red Bull Bragantino','Remo','Santos','São Paulo','Vasco da Gama','Vitória'];
const firstNames=['Lucas','Matheus','Gabriel','Pedro','Rafael','Bruno','João','Caio','Vitor','Felipe','Arthur','Davi','Gustavo','André','Diego','Thiago','Enzo','Nicolas'];const surnames=['Silva','Santos','Oliveira','Costa','Souza','Lima','Almeida','Ferreira','Ribeiro','Carvalho','Pereira','Rocha','Martins','Barbosa','Mendes'];const positions=['GOL','ZAG','ZAG','LAT','LAT','VOL','MC','MC','MEI','ATA','ATA'];
let G=load()||{club:'',week:0,year:2027,cash:18,points:0,played:0,w:0,d:0,l:0,gf:0,ga:0,formation:'4-3-3',tactic:'Equilibrada',roster:[],table:[],news:['Bem-vindo ao Career Agent Manager. Escolha seu clube para começar.'],history:[]};
function load(){try{return JSON.parse(localStorage.getItem('ca_manager_v01'))}catch(e){return null}}function save(){localStorage.setItem('ca_manager_v01',JSON.stringify(G));toast('Jogo salvo neste navegador.')}function toast(t){let e=document.getElementById('toast');if(e){e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}}
function makeRoster(club){let base=clubs.indexOf(club);return Array.from({length:22},(_,i)=>({id:i,name:firstNames[(i+base*3)%firstNames.length]+' '+surnames[(i*3+base)%surnames.length],pos:positions[i%11],age:19+(i*7+base)%15,ovr:61+((base*7+i*5)%22),potential:70+((i*3+base)%25),starter:i<11,goals:0}))}
function start(club){G={club,week:0,year:2027,cash:18,points:0,played:0,w:0,d:0,l:0,gf:0,ga:0,formation:'4-3-3',tactic:'Equilibrada',roster:makeRoster(club),table:clubs.map(c=>({club:c,p:0,j:0,w:0,d:0,l:0,gf:0,ga:0})),news:[club+' iniciou a temporada 2027. A diretoria espera uma campanha competitiva.'],history:[]};G.table[clubs.indexOf(club)].club=club;render()}
function nav(){return `<aside><div class="group">CLUBE</div>${[['home','⌂','Painel'],['squad','♙','Elenco'],['tactics','⚙','Táticas'],['league','▤','Campeonato'],['market','⇄','Mercado'],['finance','€','Finanças'],['news','◷','Notícias']].map(x=>`<button class="nav ${page===x[0]?'active':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}</aside>`}
let page='home';function go(p){page=p;render()}function head(k,t,d,act=''){return `<div class="head"><div><div class="eyebrow">${k}</div><h1>${t}</h1><div class="muted">${d}</div></div><div class="actions">${act}</div></div>`}function card(t,b){return `<section class="card"><h2>${t}</h2>${b}</section>`}function stat(t,v,s){return `<section class="card"><div class="statlabel">${t}</div><div class="stat">${v}</div><div class="muted small">${s}</div></section>`}function fmt(n){return '€ '+n.toFixed(1)+' mi'}
function render(){document.getElementById('seasonTop').textContent=`${G.year} • ${G.week}/19 rodadas`;if(!G.club){document.getElementById('root').innerHTML=`<main class="screen"><div class="hero"><div class="eyebrow">NOVO COMEÇO • V0.1</div><h1>Seu clube. Suas decisões.</h1><p class="muted">Assuma o comando de uma equipe do Brasileirão. Monte o elenco, escolha como jogar e leve seu clube ao topo.</p></div><section class="card" style="margin-top:14px"><h2>Escolha seu clube</h2><p class="muted small">Brasileirão Série A • Temporada demonstrativa 2027</p><div class="formrow"><label>Clube<select id="clubPick">${clubs.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Objetivo da diretoria<select id="goal"><option>Classificar para a Libertadores</option><option>Terminar na primeira metade</option><option>Evitar o rebaixamento</option><option>Disputar o título</option></select></label></div><button class="primary" onclick="start(document.getElementById('clubPick').value)">Assumir o clube</button> <button onclick="if(confirm('Apagar o save local?')){localStorage.removeItem('ca_manager_v01');location.reload()}">Novo jogo / apagar save</button></section></main>`;return}
document.getElementById('root').innerHTML=`<div class="layout">${nav()}<main class="main">${({home:homePage,squad:squadPage,tactics:tacticsPage,league:leaguePage,market:marketPage,finance:financePage,news:newsPage}[page]||homePage)()}</main></div>`}
function homePage(){let avg=Math.round(G.roster.reduce((a,p)=>a+p.ovr,0)/G.roster.length);return head('CENTRAL DO CLUBE',G.club,`Temporada ${G.year} • Semana ${G.week} • Comande seu time dentro e fora de campo.`,`<button onclick="go('squad')">Ver elenco</button><button class="primary" onclick="advance()" ${G.week>=19?'disabled':''}>Avançar rodada →</button>`)+`<div class="grid stats">${stat('Posição',position()+'º','Brasileirão')}${stat('Pontos',G.points,'Campanha atual')}${stat('Força do elenco',avg,'Média geral do time')}${stat('Orçamento',fmt(G.cash),'Disponível para transferências')}</div><div class="grid cols">${card('Próximo compromisso',G.week>=19?'<span class="tag">Temporada encerrada</span>':`<div class="eyebrow">RODADA ${G.week+1}</div><h2 style="font-size:23px">${opponent()} <span class="muted">${G.week%2?'(Fora)':'(Casa)'}</span></h2><p class="muted">Prepare a equipe e escolha sua estratégia.</p><button class="primary" onclick="advance()">Simular partida</button>`)}${card('Resumo da temporada',`<div class="row"><span>Jogos</span><b>${G.played}</b></div><div class="row"><span>Vitórias / Empates / Derrotas</span><b>${G.w} / ${G.d} / ${G.l}</b></div><div class="row"><span>Gols marcados</span><b>${G.gf}</b></div><div class="row"><span>Gols sofridos</span><b>${G.ga}</b></div><div class="row"><span>Saldo</span><b>${G.gf-G.ga}</b></div>`)} </div><div class="grid cols" style="margin-top:13px">${card('Últimas notícias',G.news.slice(0,4).map(n=>`<div class="feed">${n}</div>`).join(''))}${card('Atalhos',`<div class="actions"><button onclick="go('tactics')">Definir tática</button><button onclick="go('market')">Buscar reforços</button><button onclick="go('league')">Ver classificação</button></div><p class="muted small">Dica: escalação e tática influenciam a força da equipe nas partidas.</p>`)}</div>`}
function squadPage(){return head('GESTÃO DE ELENCO','Meu elenco','Confira os jogadores, suas posições e níveis gerais.',`<button onclick="autoLineup()">Escalação automática</button>`)+card('Jogadores',G.roster.map((p,i)=>`<div class="player"><div><b>${p.name}</b><div class="muted small">${p.pos} • ${p.age} anos ${p.starter?'<span class="tag">TITULAR</span>':''}</div></div><div class="ovr">${p.ovr} OVR</div></div>`).join(''))}
function tacticsPage(){return head('COMISSÃO TÉCNICA','Táticas e escalação','Escolha a formação e o comportamento da equipe. As alterações afetam a simulação.')+`<div class="grid cols">${card('Instruções',`<label class="muted small">Formação</label><select id="formation" onchange="G.formation=this.value;save()">${['4-3-3','4-4-2','4-2-3-1','3-5-2','3-4-3'].map(x=>`<option ${G.formation===x?'selected':''}>${x}</option>`).join('')}</select><div style="height:12px"></div><label class="muted small">Estilo de jogo</label><select id="tactic" onchange="G.tactic=this.value;save()">${['Equilibrada','Ofensiva','Defensiva','Posse de bola','Contra-ataque'].map(x=>`<option ${G.tactic===x?'selected':''}>${x}</option>`).join('')}</select><p class="muted small">Ofensiva aumenta a produção de gols, mas também abre espaços. Defensiva reduz riscos.</p><button class="primary" onclick="autoLineup();toast('Tática e escalação aplicadas.')">Aplicar escalação sugerida</button>`)}${card('Campo tático',`<div class="pitch">${['ATA','ATA','ATA','MEI','MC','VOL','LAT','ZAG','ZAG','LAT','GOL'].map((p,i)=>`<div class="slot"><small>${p}</small><b>${G.roster[i]?.name.split(' ')[0]||'Jogador'}</b><small>${G.roster[i]?.ovr||'—'} OVR</small></div>`).join('')}</div><p class="muted small">Representação visual simplificada da formação titular.</p>`)}</div>`}
function leaguePage(){let arr=[...G.table].sort((a,b)=>b.p-a.p||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);return head('COMPETIÇÃO','Brasileirão Série A','Classificação demonstrativa atualizada após cada rodada.')+card('Tabela de classificação',`<div style="overflow:auto"><table><thead><tr><th>#</th><th>CLUBE</th><th>PTS</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr></thead><tbody>${arr.map((t,i)=>`<tr class="${t.club===G.club?'me':''}"><td class="rank">${i+1}</td><td class="club">${t.club}</td><td><b>${t.p}</b></td><td>${t.j}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf-t.ga}</td></tr>`).join('')}</tbody></table></div><p class="muted small">Tabela parcial de teste. A temporada possui 19 rodadas nesta versão curta.</p>`)}
function marketPage(){let candidates=[{name:'João Pedro',pos:'ATA',age:21,ovr:74,value:8.5},{name:'Ramon Silva',pos:'ZAG',age:24,ovr:71,value:5.2},{name:'Caio Henrique',pos:'MC',age:20,ovr:73,value:7.1},{name:'Léo Martins',pos:'GOL',age:23,ovr:72,value:4.8}];return head('DIRETORIA DE FUTEBOL','Mercado de transferências','Jogadores disponíveis para reforçar o elenco nesta versão de teste.')+card('Oportunidades',candidates.map((p,i)=>`<div class="player"><div><b>${p.name}</b><div class="muted small">${p.pos} • ${p.age} anos • ${fmt(p.value)}</div></div><div class="actions"><b class="ovr">${p.ovr}</b><button onclick="buy(${i})" ${G.cash<p.value?'disabled':''}>Contratar</button></div></div>`).join('')+`<p class="muted small">Contratações são demonstrativas; negociação de salários e contratos será aprofundada em versões futuras.</p>`)}
function financePage(){return head('ADMINISTRAÇÃO','Finanças','Controle simplificado das receitas e despesas do clube.')+`<div class="grid stats">${stat('Saldo',fmt(G.cash),'Orçamento disponível')}${stat('Bilheteria acumulada',fmt(G.played*.45),'Estimativa')}${stat('Folha salarial',fmt(G.roster.length*.035),'Por rodada')}${stat('Valor do elenco',fmt(G.roster.reduce((a,p)=>a+p.ovr*.12,0)),'Estimativa')}</div>`+card('Movimentações',`<div class="row"><span>Receita por rodada em casa</span><b class="green">+ € 0,45 mi</b></div><div class="row"><span>Despesas por rodada</span><b class="red">− € 0,77 mi</b></div><div class="row"><span>Orçamento inicial</span><b>€ 18,0 mi</b></div>`)}function newsPage(){return head('CENTRAL DE NOTÍCIAS','Notícias do clube','Comunicados, resultados e acontecimentos da temporada.')+card('Mural',G.news.map(n=>`<div class="feed">${n}</div>`).join(''))}
function position(){let a=[...G.table].sort((x,y)=>y.p-x.p||(y.gf-y.ga)-(x.gf-x.ga));return a.findIndex(x=>x.club===G.club)+1}function opponent(){let others=clubs.filter(c=>c!==G.club);return others[(G.week*7+clubs.indexOf(G.club)*3)%others.length]}function autoLineup(){G.roster.sort((a,b)=>b.ovr-a.ovr);G.roster.forEach((p,i)=>p.starter=i<11);save();render()}
function advance(){if(G.week>=19)return;let opp=opponent(),home=G.week%2===0,own=G.roster.filter(p=>p.starter).reduce((a,p)=>a+p.ovr,0)/11;let rival=clubs.indexOf(opp),oppPower=68+(rival*7%13);let mod=G.tactic==='Ofensiva'?2:G.tactic==='Defensiva'?-1:G.tactic==='Posse de bola'?1:G.tactic==='Contra-ataque'?1:0;let diff=(own+mod+(home?2:0)-oppPower)/15;let hg=Math.max(.35,1.25+diff*.55),ag=Math.max(.3,1.12-diff*.48);let poisson=l=>{let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1};let a=poisson(hg),b=poisson(ag);if(!home)[a,b]=[b,a];G.played++;G.week++;G.gf+=a;G.ga+=b;let me=G.table.find(x=>x.club===G.club),them=G.table.find(x=>x.club===opp);[[me,a,b],[them,b,a]].forEach(([t,x,y])=>{t.j++;t.gf+=x;t.ga+=y;if(x>y){t.w++;t.p+=3}else if(x===y){t.d++;t.p++}else t.l++});if(a>b){G.w++;G.points+=3}else if(a===b){G.d++;G.points++}else G.l++;G.cash+=home?.45:-.12;let line=`Rodada ${G.week}: ${G.club} ${a} × ${b} ${opp} ${home?'(casa)':'(fora)'}.`;G.news.unshift(line);G.history.unshift(line);if(G.week===19)G.news.unshift('Temporada curta de teste encerrada. Confira a classificação final.');save();render();}
function buy(i){let p=[{name:'João Pedro',pos:'ATA',age:21,ovr:74,value:8.5},{name:'Ramon Silva',pos:'ZAG',age:24,ovr:71,value:5.2},{name:'Caio Henrique',pos:'MC',age:20,ovr:73,value:7.1},{name:'Léo Martins',pos:'GOL',age:23,ovr:72,value:4.8}][i];if(G.cash<p.value)return;G.cash-=p.value;G.roster.push({...p,starter:false,goals:0,potential:p.ovr+12});G.news.unshift(`${p.name} foi contratado pelo ${G.club} por ${fmt(p.value)}.`);save();render()}
render();</script></body></html>
