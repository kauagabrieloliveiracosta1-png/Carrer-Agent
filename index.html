<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Agent — Simulador de Empresário</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--panel2:#192740;--line:#2a3b57;--text:#eef4ff;--muted:#9eafc8;--accent:#42c58a;--blue:#6aa8ff;--red:#ff7474;--gold:#e8bd63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:#20324d;color:var(--text);font-weight:650}button:hover{filter:brightness(1.15)}button.primary{background:var(--accent);color:#071b13;border-color:var(--accent)}button.danger{background:#492a36;border-color:#75404c}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1450px;margin:auto;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);background:#0e192a;position:sticky;top:0;z-index:4}.brand{font-size:20px;font-weight:900;letter-spacing:.08em}.brand span{color:var(--accent)}.topmeta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 65px)}aside{padding:16px 12px;border-right:1px solid var(--line);background:#0e192a}.navgroup{font-size:11px;color:#7488a6;text-transform:uppercase;letter-spacing:.12em;padding:12px 10px 6px}.nav{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border-color:transparent;color:#b9c8dd;margin:2px 0}.nav.active{background:#1c3049;border-color:#365273;color:white}.nav .ico{width:20px;text-align:center}.main{padding:24px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{font-size:27px;margin:3px 0 5px}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.cols{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px;min-width:0}.statlabel{font-size:12px;color:var(--muted)}.statvalue{font-size:25px;font-weight:850;margin-top:4px}.green{color:var(--accent)}.gold{color:var(--gold)}.red{color:var(--red)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.stack{display:grid;gap:11px}.divider{height:1px;background:var(--line);margin:12px 0}label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}input,select{width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:#0c1728;color:var(--text);outline:none}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;padding:4px 8px;border-radius:20px;background:#203b37;color:#9ce8c5;font-size:11px;font-weight:750}.pill.warn{background:#443922;color:#f1d28b}.pill.bad{background:#492a36;color:#ffabab}.bar{height:8px;background:#27364e;border-radius:20px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);border-radius:20px}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #26364e}.item:last-child{border:0}.logline{padding:8px 0;border-bottom:1px solid #26364e;font-size:13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:650}.notice{border-left:3px solid var(--gold);padding:9px 12px;background:#20283a;border-radius:7px;color:#d9e3f3;font-size:13px}.empty{padding:22px;text-align:center;color:var(--muted)}.mainmenu{min-height:calc(100vh - 130px);display:grid;place-items:center;background:radial-gradient(ellipse at 50% 15%,#1b3550 0%,#0b1220 62%);padding:28px}.menuwrap{width:min(1050px,100%);text-align:center}.menulogo{font-size:clamp(38px,8vw,68px);font-weight:950;letter-spacing:.09em;margin:8px 0}.menulogo span{color:var(--accent)}.menusub{color:var(--muted);letter-spacing:.18em;text-transform:uppercase;font-size:11px}.menucard{margin:28px auto 0;max-width:430px;background:#121d30ef;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:left;box-shadow:0 24px 70px #0006}.menucard button{width:100%;margin-top:10px;padding:13px}.menufoot{margin-top:20px;color:#8193ad;font-size:12px}.teamgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}.teamcard{background:#121d30;border:1px solid var(--line);border-radius:14px;padding:15px;text-align:left}.teamcard h3{font-size:16px;margin:8px 0 3px}.teamcard button{width:100%;margin-top:12px}.crest{width:66px;height:76px;display:grid;place-items:center;clip-path:polygon(8% 0,92% 0,88% 68%,50% 100%,12% 68%);font-weight:950;font-size:17px;letter-spacing:-1px;border:0;box-shadow:0 6px 18px #0005;color:white;text-shadow:0 1px 3px #000}.clubhero{display:flex;gap:18px;align-items:center}.clubhero .crest{width:88px;height:100px;font-size:22px;flex-shrink:0}.playergrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.playercard{background:#0e192a;border:1px solid var(--line);border-radius:12px;padding:13px}.playerhead{display:flex;justify-content:space-between;gap:10px}.rating{font-size:22px;font-weight:900;color:var(--accent)}.menuactions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.footer{padding:18px 24px;color:#7587a3;font-size:11px;border-top:1px solid var(--line)}
@media(max-width:1000px){.teamgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:5px;position:sticky;top:61px;z-index:3}.navgroup{display:none}.nav{white-space:nowrap;width:auto;margin:0;padding:9px}.main{padding:16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cols,.three{grid-template-columns:1fr}.teamgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{padding:12px}.topmeta{gap:6px}.topmeta .hide{display:none}}@media(max-width:520px){.teamgrid,.playergrid{grid-template-columns:1fr}.statvalue{font-size:21px}.formgrid{grid-template-columns:1fr}.pagehead{display:block}.pagehead .actions{margin-top:12px}.clubhero{align-items:flex-start}}
</style></head><body><div class="app"><header class="top"><div class="brand">CAREER <span>AGENT</span></div><div class="topmeta"><span id="dateTop">Simulador de empresário</span><span class="hide" id="saveStatus">Salvamento local</span><button id="homeButton" onclick="returnMainMenu()" style="display:none">⌂ Menu principal</button><button id="saveButton" onclick="saveGame()" style="display:none">Salvar</button></div></header><div class="layout"><aside id="nav"></aside><main class="main" id="main"></main></div><div class="footer">CAREER AGENT • Simulador de empresário de futebol • Dados demonstrativos • Salvamento local no navegador</div></div>
<script>
const fmt=n=>'€ '+Number(n||0).toFixed(2)+' mi';
const clubs=[
 {name:'Flamengo',city:'Rio de Janeiro, RJ',state:'Brasil',league:'Campeonato Brasileiro • Série A',abbr:'CRF',colors:['#b51f2b','#111111'],stadium:'Maracanã',founded:1895,rank:'Elite nacional'},
 {name:'Palmeiras',city:'São Paulo, SP',state:'Brasil',league:'Campeonato Brasileiro • Série A',abbr:'SEP',colors:['#087a45','#f4f4f4'],stadium:'Allianz Parque',founded:1914,rank:'Elite nacional'},
 {name:'Corinthians',city:'São Paulo, SP',state:'Brasil',league:'Campeonato Brasileiro • Série A',abbr:'SCCP',colors:['#eeeeee','#202020'],stadium:'Neo Química Arena',founded:1910,rank:'Elite nacional'},
 {name:'São Paulo',city:'São Paulo, SP',state:'Brasil',league:'Campeonato Brasileiro • Série A',abbr:'SPFC',colors:['#eeeeee','#d32935'],stadium:'MorumBIS',founded:1930,rank:'Elite nacional'},
 {name:'Santos',city:'Santos, SP',state:'Brasil',league:'Campeonato Brasileiro • Série A',abbr:'SFC',colors:['#eeeeee','#171717'],stadium:'Vila Belmiro',founded:1912,rank:'Elite nacional'},
 {name:'Grêmio',city:'Porto Alegre, RS',state:'Brasil',league:'Campeonato Brasileiro • Série A',abbr:'GFBPA',colors:['#1688c9','#171717'],stadium:'Arena do Grêmio',founded:1903,rank:'Elite nacional'},
 {name:'Vasco da Gama',city:'Rio de Janeiro, RJ',state:'Brasil',league:'Campeonato Brasileiro • Série A',abbr:'CRVG',colors:['#eeeeee','#171717'],stadium:'São Januário',founded:1898,rank:'Elite nacional'},
 {name:'Botafogo',city:'Rio de Janeiro, RJ',state:'Brasil',league:'Campeonato Brasileiro • Série A',abbr:'BFR',colors:['#171717','#eeeeee'],stadium:'Nilton Santos',founded:1904,rank:'Elite nacional'},
 {name:'Bahia',city:'Salvador, BA',state:'Brasil',league:'Campeonato Brasileiro • Série A',abbr:'ECB',colors:['#1d75c8','#d52d36'],stadium:'Arena Fonte Nova',founded:1931,rank:'Elite nacional'},
 {name:'Cruzeiro',city:'Belo Horizonte, MG',state:'Brasil',league:'Campeonato Brasileiro • Série A',abbr:'CEC',colors:['#1769bd','#eeeeee'],stadium:'Mineirão',founded:1921,rank:'Elite nacional'},
 {name:'Barcelona',city:'Barcelona',state:'Espanha',league:'La Liga',abbr:'FCB',colors:['#9c1734','#17428b'],stadium:'Spotify Camp Nou',founded:1899,rank:'Elite europeia'},
 {name:'Real Madrid',city:'Madrid',state:'Espanha',league:'La Liga',abbr:'RM',colors:['#eeeeee','#17428b'],stadium:'Santiago Bernabéu',founded:1902,rank:'Elite europeia'}
];
const playerPool=[
 {name:'Neymar Jr.',club:'Santos',pos:'MEI/ATA',age:34,rating:86,value:12.0,wage:.45,contract:'31/12/2026',country:'Brasil'},
 {name:'Raphinha',club:'Barcelona',pos:'ATA',age:29,rating:88,value:65,wage:1.1,contract:'30/06/2028',country:'Brasil'},
 {name:'Vinícius Júnior',club:'Real Madrid',pos:'ATA',age:26,rating:92,value:150,wage:2.2,contract:'30/06/2027',country:'Brasil'},
 {name:'Endrick',club:'Lyon',pos:'ATA',age:20,rating:82,value:42,wage:.42,contract:'30/06/2030',country:'Brasil'},
 {name:'Matheus Cunha',club:'Manchester United',pos:'ATA',age:27,rating:85,value:62,wage:1.0,contract:'30/06/2030',country:'Brasil'},
 {name:'Rayan',club:'Bournemouth',pos:'ATA',age:20,rating:79,value:28,wage:.25,contract:'30/06/2031',country:'Brasil'},
 {name:'Lucas Paquetá',club:'Flamengo',pos:'MEI',age:29,rating:86,value:38,wage:.65,contract:'31/12/2029',country:'Brasil'},
 {name:'Gabriel Martinelli',club:'Arsenal',pos:'ATA',age:25,rating:87,value:72,wage:1.0,contract:'30/06/2027',country:'Brasil'},
 {name:'Neymar Jr.',club:'Santos',pos:'MEI/ATA',age:34,rating:86,value:12.0,wage:.45,contract:'31/12/2026',country:'Brasil'},
 {name:'Andrey Santos',club:'Chelsea',pos:'VOL',age:22,rating:82,value:35,wage:.3,contract:'30/06/2030',country:'Brasil'}
];
const initial=()=>({gameType:'agent',page:'dashboard',agent:'Meu Empresário',agency:'Agência Elite',rep:25,cash:.35,month:10,year:2026,focusClub:0,clients:[
 {...playerPool[0],fee:8,relationship:80,status:'Contrato ativo'},
 {...playerPool[6],fee:7,relationship:74,status:'Contrato ativo'},
 {...playerPool[5],fee:6,relationship:65,status:'Contrato ativo'}
],deals:[],news:['Agência criada. Seu trabalho é construir um portfólio de atletas e fechar os melhores contratos.'],log:['Início da atividade como empresário de futebol.'],scouted:playerPool.slice(1,8),expenses:.04,income:.08});
function loadGame(){try{const x=JSON.parse(localStorage.getItem('careerAgentSave'));if(x&&x.gameType!=='agent'){localStorage.removeItem('careerAgentSave');return null}return x}catch(e){localStorage.removeItem('careerAgentSave');return null}}
let savedCareer=loadGame();let S=savedCareer||initial();S.page='mainmenu';
const navItems=[['dashboard','⌂','Visão geral','AGÊNCIA'],['clients','♙','Meus jogadores'],['market','◎','Prospecção'],['negotiations','⇄','Negociações'],['agency','▦','Minha agência','GESTÃO'],['finance','€','Finanças'],['calendar','▤','Calendário'],['news','◷','Notícias']];
function toast(m){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;bottom:20px;right:20px;background:#203b37;border:1px solid #42c58a;padding:12px 16px;border-radius:10px;z-index:10;color:white;box-shadow:0 8px 30px #0008';document.body.appendChild(e)}e.textContent=m;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2300)}
function saveGame(){localStorage.setItem('careerAgentSave',JSON.stringify(S));savedCareer={...S};document.getElementById('saveStatus').textContent='Salvo '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});toast('Agência salva neste navegador.')}
function autoSave(){localStorage.setItem('careerAgentSave',JSON.stringify(S));savedCareer={...S}}
function log(m){S.log.unshift(m);S.news.unshift(m);S.log=S.log.slice(0,40);S.news=S.news.slice(0,20)}
function fmtDate(){return ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][S.month]+' '+S.year}
function crest(c,large=false){return `<div class="crest" style="background:linear-gradient(145deg,${c.colors[0]},${c.colors[1]})" title="Escudo ilustrativo de ${c.name}">${c.abbr}</div>`}
function head(k,t,d,extra=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1>${t}</h1><div class="muted">${d}</div></div>${extra}</div>`}
function stat(l,v,s='',c=''){return `<div class="card"><div class="statlabel">${l}</div><div class="statvalue ${c}">${v}</div>${s?`<div class="muted small">${s}</div>`:''}</div>`}
function card(t,b){return `<section class="card"><h2>${t}</h2>${b}</section>`}
function row(a,b){return `<div class="item"><span class="muted">${a}</span><strong>${b}</strong></div>`}
function render(){let aside=document.getElementById('nav'),main=document.getElementById('main'),save=document.getElementById('saveButton'),home=document.getElementById('homeButton');if(['mainmenu','clubselect'].includes(S.page)){aside.style.display='none';document.querySelector('.layout').style.gridTemplateColumns='1fr';save.style.display='none';home.style.display='none';document.getElementById('dateTop').textContent='Simulador de empresário de futebol';main.innerHTML=S.page==='mainmenu'?mainMenu():clubSelection();return}aside.style.display='';document.querySelector('.layout').style.gridTemplateColumns='';save.style.display='';home.style.display='';aside.innerHTML=navItems.map(n=>(n[3]?`<div class="navgroup">${n[3]}</div>`:'')+`<button class="nav ${S.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span>${n[2]}</button>`).join('');document.getElementById('dateTop').textContent=fmtDate();document.getElementById('saveStatus').textContent='Portfólio: '+S.clients.length+' atletas';let pages={dashboard,clients:clientsPage,market,negotiations,agency,finance,calendar,news};main.innerHTML=(pages[S.page]||dashboard)()}
function mainMenu(){let has=!!savedCareer;return `<div class="mainmenu"><div class="menuwrap"><div class="menusub">Football agent simulator</div><div class="menulogo">CAREER <span>AGENT</span></div><div class="muted">Construa sua agência. Descubra talentos. Negocie contratos. Gerencie carreiras.</div><div class="menucard"><div class="eyebrow">Menu principal</div><h2 style="font-size:23px;margin:5px 0 3px">Sua carreira como empresário começa aqui</h2><div class="muted small">Você representa jogadores; os clubes são o mercado onde seus atletas trabalham.</div><button class="primary" onclick="startNew()">Nova carreira de empresário</button><button ${has?'':'disabled'} onclick="continueGame()">Continuar ${has?'— '+(savedCareer.agency||'Minha agência'):''}</button><button onclick="about()">Sobre o jogo</button>${has?'<button class="danger" onclick="deleteSave()">Excluir save</button>':''}</div><div class="menufoot">PACOTE JOGÁVEL • Protótipo local</div></div></div>`}
function startNew(){S=initial();S.page='clubselect';savedCareer=null;render()}
function clubSelection(){return `<div class="mainmenu"><div class="menuwrap"><div class="menusub">Nova agência • primeiro mercado</div><div class="menulogo" style="font-size:clamp(32px,6vw,52px)">ESCOLHA SEU <span>CLUBE DE REFERÊNCIA</span></div><div class="muted">Escolha um clube real para acompanhar de perto no início. Você não será dono do clube: será empresário de jogadores e negociará com clubes do mercado.</div><div class="teamgrid">${clubs.map((c,i)=>`<div class="teamcard">${crest(c)}<h3>${c.name}</h3><div class="muted small">${c.city} • ${c.league}</div><div class="muted small" style="margin-top:6px">Estádio: ${c.stadium}</div><button class="primary" onclick="chooseClub(${i})">Definir como clube de referência</button></div>`).join('')}</div><div class="menuactions"><button onclick="S.page='mainmenu';render()">← Voltar ao menu principal</button></div></div></div>`}
function chooseClub(i){S.focusClub=i;S.page='dashboard';log(`Clube de referência escolhido: ${clubs[i].name}. Você continua atuando como empresário independente.`);autoSave();render();toast(clubs[i].name+' definido como referência.')}
function continueGame(){if(!savedCareer)return;S={...initial(),...savedCareer,page:'dashboard'};render()}
function returnMainMenu(){autoSave();S.page='mainmenu';render()}
function deleteSave(){if(!confirm('Excluir definitivamente o save desta agência neste navegador?'))return;localStorage.removeItem('careerAgentSave');savedCareer=null;S=initial();S.page='mainmenu';render();toast('Save excluído.')}
function about(){alert('Career Agent — simulador de empresário de futebol. Você administra uma agência e representa jogadores. Os clubes são equipes reais do mercado, não instituições controladas pelo jogador.');}
function go(p){S.page=p;render()}
function dashboard(){let c=clubs[S.focusClub]||clubs[0],v=S.clients.reduce((a,p)=>a+p.value,0);return head('Painel da agência','Visão geral','Acompanhe seus atletas, oportunidades e negociações.',`<div class="actions"><button class="primary" onclick="advanceMonth()">Avançar mês</button></div>`)+`<div class="grid stats">${stat('Jogadores representados',S.clients.length,'Atletas sob contrato')}${stat('Valor do portfólio',fmt(v),'Valor de mercado estimado','green')}${stat('Saldo da agência',fmt(S.cash),'Caixa disponível')}${stat('Reputação',S.rep+'/100','Credibilidade no mercado')}</div><div class="grid cols">${card('Clube de referência',`<div class="clubhero">${crest(c,true)}<div><h2 style="margin-bottom:4px">${c.name}</h2><div class="muted">${c.city} • ${c.state}</div><div class="muted small">${c.league}</div><span class="pill" style="margin-top:8px">${c.rank}</span></div></div><div class="divider"></div>${row('Fundação',c.founded)}${row('Estádio',c.stadium)}${row('Papel no jogo','Clube do mercado • não controlado')}`)}${card('Desempenho da agência',`${row('Agência',S.agency)}${row('Empresário',S.agent)}${row('Comissão média', '8%')}${row('Receita mensal estimada',fmt(S.income))}${row('Despesas mensais',fmt(S.expenses))}<div class="notice">Seu objetivo é atrair talentos, proteger os interesses dos atletas e fechar os melhores contratos.</div>`)}</div><div class="grid cols" style="margin-top:14px">${card('Meus jogadores',S.clients.slice(0,4).map(p=>`<div class="item"><div><strong>${p.name}</strong><div class="muted small">${p.pos} • ${p.club}</div></div><strong class="green">${p.rating}</strong></div>`).join('')||'<div class="empty">Ainda não há atletas representados.</div>'+'<button style="margin-top:10px" onclick="go(\'market\')">Buscar jogadores</button>')}${card('Últimas notícias',S.news.slice(0,5).map(x=>`<div class="logline">${x}</div>`).join(''))}</div>`}
function clientsPage(){return head('Portfólio','Meus jogadores','Gerencie contratos, valores, relações e oportunidades dos atletas que você representa.',`<div class="actions"><button class="primary" onclick="go('market')">+ Buscar jogadores</button></div>`)+`<div class="playergrid">${S.clients.map((p,i)=>`<div class="playercard"><div class="playerhead"><div><strong>${p.name}</strong><div class="muted small">${p.pos} • ${p.age} anos • ${p.country}</div></div><div class="rating">${p.rating}</div></div><div class="divider"></div>${row('Clube atual',p.club)}${row('Valor estimado',fmt(p.value))}${row('Salário',fmt(p.wage)+'/mês')}${row('Contrato',p.contract)}${row('Sua comissão',p.fee+'%')}${row('Relacionamento',p.relationship+'/100')}<div class="bar"><i style="width:${p.relationship}%"></i></div><div class="actions" style="margin-top:12px"><button onclick="negotiateRenew(${i})">Renovar representação</button><button class="danger" onclick="releaseClient(${i})">Encerrar contrato</button></div></div>`).join('')||'<div class="empty">Você ainda não representa jogadores. Vá à prospecção e contrate seu primeiro atleta.</div>'}</div>`}
function market(){let represented=S.clients.map(p=>p.name);return head('Recrutamento','Prospecção de talentos','Observe jogadores disponíveis para representação. Dados e avaliações são demonstrativos.')+`<div class="notice" style="margin-bottom:14px">Os nomes e clubes abaixo são de atletas reais. As avaliações e valores de mercado no protótipo são estimativas de jogo, não cotações oficiais.</div><div class="playergrid">${S.scouted.filter(p=>!represented.includes(p.name)).map((p,i)=>`<div class="playercard"><div class="playerhead"><div><strong>${p.name}</strong><div class="muted small">${p.club} • ${p.pos} • ${p.age} anos</div></div><div class="rating">${p.rating}</div></div><div class="divider"></div>${row('Valor de mercado',fmt(p.value))}${row('Salário estimado',fmt(p.wage)+'/mês')}${row('Contrato atual',p.contract)}<button class="primary" style="width:100%;margin-top:10px" onclick="signPlayer(${S.scouted.indexOf(p)})">Oferecer contrato de representação</button></div>`).join('')||'<div class="empty">Todos os jogadores desta lista já estão no seu portfólio.</div>'}</div>`}
function negotiations(){return head('Mercado de transferências','Negociações','Envie propostas a clubes interessados nos seus jogadores e acompanhe os acordos.')+`<div class="grid cols">${card('Criar proposta',`<div class="stack"><div><label>Jogador representado</label><select id="dealPlayer">${S.clients.map((p,i)=>`<option value="${i}">${p.name} — ${p.club}</option>`).join('')}</select></div><div><label>Clube interessado</label><select id="dealClub">${clubs.map(c=>`<option>${c.name}</option>`).join('')}<option>Arsenal</option><option>Manchester United</option><option>Paris Saint-Germain</option><option>Bayern de Munique</option></select></div><div><label>Valor da proposta (€ milhões)</label><input id="dealValue" type="number" min=".1" step=".1" value="12"></div><div><label>Comissão do empresário (%)</label><input id="dealFee" type="number" min="1" max="20" value="8"></div><button class="primary" onclick="createDeal()" ${S.clients.length?'':'disabled'}>Enviar proposta</button></div>`)}${card('Histórico de negociações',S.deals.length?S.deals.map(d=>`<div class="item"><div><strong>${d.player}</strong><div class="muted small">${d.club} • ${fmt(d.value)} • Comissão ${d.fee}%</div><span class="pill ${d.status==='Aceita'?'':'warn'}">${d.status}</span></div>${d.status==='Em análise'?`<div class="actions"><button class="primary" onclick="dealDecision(${d.id},true)">Aceitar</button><button class="danger" onclick="dealDecision(${d.id},false)">Recusar</button></div>`:''}</div>`).join(''):'<div class="empty">Nenhuma proposta enviada.</div>')}</div>`}
function agency(){return head('Estrutura profissional','Minha agência','Organize sua operação, identidade e reputação como empresário.')+`<div class="grid cols">${card('Dados da agência',`<div class="stack"><label>Nome da agência</label><input id="agencyName" value="${S.agency}"><label>Nome do empresário</label><input id="agentName" value="${S.agent}"><button class="primary" onclick="saveAgency()">Salvar identidade</button></div>`)}${card('Indicadores',`${row('Atletas representados',S.clients.length)}${row('Reputação',S.rep+'/100')}${row('Valor do portfólio',fmt(S.clients.reduce((a,p)=>a+p.value,0)))}${row('Negociações concluídas',S.deals.filter(d=>d.status==='Aceita').length)}`)}</div>`}
function finance(){return head('Administração','Finanças da agência','Controle comissões, despesas e saldo operacional.')+`<div class="grid stats">${stat('Saldo',fmt(S.cash),'Caixa disponível')}${stat('Receita mensal',fmt(S.income),'Comissões estimadas','green')}${stat('Despesas',fmt(S.expenses),'Custos operacionais')}${stat('Resultado',fmt(S.income-S.expenses),'Saldo mensal',(S.income>=S.expenses?'green':'red'))}</div><div class="grid cols">${card('Movimentações',`${row('Comissões recebidas',fmt(S.income))}${row('Despesas da agência',fmt(S.expenses))}${row('Resultado mensal',fmt(S.income-S.expenses))}`)}${card('Investir na agência',`<label>Investimento em prospecção (€ mi)</label><input id="investValue" type="number" min=".01" step=".01" value=".05"><button class="primary" style="margin-top:10px" onclick="investAgency()">Investir em prospecção</button><p class="muted small">Aumenta sua reputação e pode melhorar a qualidade dos atletas encontrados em versões futuras.</p>`)}</div>`}
function calendar(){return head('Agenda','Calendário do empresário','Acompanhe a evolução mensal da agência e programe suas negociações.')+`<div class="grid cols">${card('Período atual',`<div class="statvalue">${fmtDate()}</div><p class="muted">Avance o mês para processar comissões, despesas e eventos de mercado.</p><button class="primary" onclick="advanceMonth()">Avançar um mês</button>`)}${card('Agenda de negócios',`${row('Contratos ativos',S.clients.length)}${row('Propostas em análise',S.deals.filter(d=>d.status==='Em análise').length)}${row('Acordos aceitos',S.deals.filter(d=>d.status==='Aceita').length)}`)}</div>`}
function news(){return head('Central de informação','Notícias','Acompanhe os acontecimentos da sua agência e do mercado.')+card('Últimos acontecimentos',S.news.map(x=>`<div class="logline">▸ ${x}</div>`).join(''))}
function signPlayer(i){let p=S.scouted[i];if(!p)return;if(S.clients.some(x=>x.name===p.name))return toast('Este jogador já está representado.');let n={...p,fee:8,relationship:55,status:'Contrato ativo'};S.clients.push(n);S.scouted.splice(i,1);S.rep=Math.min(100,S.rep+2);log(`Contrato de representação assinado com ${p.name}.`);S.income+=.01;autoSave();render();toast(p.name+' agora faz parte do seu portfólio.')}
function releaseClient(i){let p=S.clients[i];if(!p)return;if(!confirm('Encerrar o contrato de representação de '+p.name+'?'))return;S.clients.splice(i,1);log(`Contrato de representação encerrado com ${p.name}.`);autoSave();render()}
function negotiateRenew(i){let p=S.clients[i];if(!p)return;p.fee=Math.min(15,p.fee+1);p.relationship=Math.min(100,p.relationship+8);p.status='Representação renovada';log(`Representação de ${p.name} renovada. Comissão ajustada para ${p.fee}%.`);autoSave();render();toast('Contrato de representação renovado.')}
function createDeal(){let p=S.clients[Number(document.getElementById('dealPlayer').value)];if(!p)return toast('Adicione jogadores ao portfólio primeiro.');let club=document.getElementById('dealClub').value,value=Number(document.getElementById('dealValue').value),fee=Number(document.getElementById('dealFee').value);if(value<=0||fee<1||fee>20)return toast('Confira os valores da proposta.');S.deals.unshift({id:Date.now(),player:p.name,club,value,fee,status:'Em análise'});log(`Proposta enviada por ${p.name}: ${club} ofereceu ${fmt(value)}.`);autoSave();render()}
function dealDecision(id,yes){let d=S.deals.find(x=>x.id===id);if(!d)return;d.status=yes?'Aceita':'Recusada';if(yes){let commission=d.value*d.fee/100;S.cash+=commission;S.income+=commission/12;S.rep=Math.min(100,S.rep+3);log(`Acordo aceito: ${d.player} negociado com ${d.club}. Comissão da agência: ${fmt(commission)}.`)}else log(`Proposta por ${d.player} recusada pela agência.`);autoSave();render()}
function saveAgency(){S.agency=document.getElementById('agencyName').value.trim()||'Minha Agência';S.agent=document.getElementById('agentName').value.trim()||'Empresário';log('Identidade da agência atualizada.');autoSave();render();toast('Dados da agência salvos.')}
function investAgency(){let n=Number(document.getElementById('investValue').value);if(n<=0||n>S.cash)return toast('Saldo insuficiente ou valor inválido.');S.cash-=n;S.rep=Math.min(100,S.rep+2);log(`Agência investiu ${fmt(n)} em prospecção e relacionamento.`);autoSave();render()}
function advanceMonth(){let net=S.income-S.expenses;S.cash+=net;S.month++;if(S.month>11){S.month=0;S.year++}S.clients.forEach(p=>{p.relationship=Math.max(35,Math.min(100,p.relationship+(Math.random()>.35?2:-1))) });log(`Relatório mensal: ${net>=0?'resultado positivo':'resultado negativo'} de ${fmt(net)}.`);autoSave();render()}
render();
</script></body></html>
