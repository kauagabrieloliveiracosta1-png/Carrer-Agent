function mainMenu(){let has=!!savedCareer;return `<div class="mainmenu"><div class="menuwrap"><div class="menusub">Football agent simulator</div><div class="menulogo">CAREER <span>AGENT</span></div><div class="muted">Construa sua agência. Descubra talentos. Negocie contratos. Gerencie carreiras.</div><div class="menucard"><div class="eyebrow">Menu principal</div><h2 style="font-size:23px;margin:5px 0 3px">Sua carreira como empresário começa aqui</h2><div class="muted small">Você representa jogadores; os clubes são o mercado onde seus atletas trabalham.</div><button class="primary" onclick="startNew()">Nova carreira de empresário</button><button ${has?'':'disabled'} onclick="continueGame()">Continuar ${has?'— '+(savedCareer.agency||'Minha agência'):''}</button><button onclick="about()">Sobre o jogo</button>${has?'<button class="danger" onclick="deleteSave()">Excluir save</button>':''}</div><div class="menufoot">PACOTE JOGÁVEL • Protótipo local</div></div></div>`}
function startNew(){resetLeagueTeams();S=initial();S.rosterVersion=2;S.page='setup';savedCareer=null;render()}
function setupPage(){return `<div class="mainmenu"><div class="menuwrap"><div class="menusub">Nova carreira • identidade profissional</div><div class="menulogo" style="font-size:clamp(32px,6vw,52px)">CRIE SUA <span>AGÊNCIA</span></div><div class="muted">Defina sua identidade e escolha as ligas que deseja acompanhar. Você começará sem jogadores e decidirá quem merece ser representado.</div><div class="menucard" style="max-width:720px"><div class="formgrid"><div><label>Nome do agente</label><input id="setupAgent" placeholder="Ex.: Rafael Costa" maxlength="40"></div><div><label>Nome da agência</label><input id="setupAgency" placeholder="Ex.: Costa Sports" maxlength="50"></div></div><div class="divider"></div><h2>Ligas para acompanhar</h2><div class="muted small" style="margin-bottom:12px">Selecione uma ou várias ligas. Sua escolha orientará notícias, observação de talentos e oportunidades do mercado.</div><div class="grid three">${leagues.map((l,i)=>`<label style="display:flex;gap:8px;align-items:center;background:#0c1728;border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--text)"><input type="checkbox" name="setupLeague" value="${l}" ${i<2?'checked':''} style="width:auto">${l}</label>`).join('')}</div><div class="actions" style="margin-top:18px"><button class="primary" onclick="finishSetup()">Começar como empresário</button><button onclick="S.page='mainmenu';render()">Voltar ao menu principal</button></div></div></div></div>`}
function finishSetup(){resetLeagueTeams();S.leagueTeams=null;S.rosterVersion=2;S.seasonHistory=[];S.seasonFinalizedYear=null;let agent=document.getElementById('setupAgent').value.trim(),agency=document.getElementById('setupAgency').value.trim(),selected=[...document.querySelectorAll('input[name=setupLeague]:checked')].map(x=>x.value);if(selected.some(l=>l==='Campeonato Brasileiro Série A'||l==='Campeonato Brasileiro Série B'))selected=[...new Set([...selected,'Campeonato Brasileiro Série A','Campeonato Brasileiro Série B'])];if(selected.some(l=>l.startsWith('MLS – Conferência')))selected=[...new Set([...selected,'MLS – Conferência Leste','MLS – Conferência Oeste'])];if(!agent||!agency)return toast('Preencha o nome do agente e da agência.');if(!selected.length)return toast('Escolha pelo menos uma liga para acompanhar.');S.agent=agent;S.agency=agency;S.leagues=selected;S.setupComplete=true;S.seasonYear=2026;S.year=2026;S.week=0;S.window2Active=false;S.repEventKeys=S.repEventKeys||['year-2026'];S.youthPool=randomYouth(2);S.playerOffers=[];S.leagueTables={};ensureLeagueTables();S.matchHistory=[];S.page='dashboard';log(`${agency}, liderada por ${agent}, iniciou as atividades. Ligas acompanhadas: ${selected.join(', ')}.`);autoSave();render();toast('Sua agência está pronta. Escolha seus primeiros jogadores!')}
function continueGame(){if(!savedCareer)return;S={...initial(),...savedCareer,page:'dashboard'};const savedRosterVersion=Number(S.rosterVersion||0);if(savedRosterVersion<2){S.leagueTeams=null;S.leagueTables={};}if(S.leagueTeams&&savedRosterVersion>=2)Object.keys(S.leagueTeams).forEach(k=>{if(leagueTeams[k])leagueTeams[k]=S.leagueTeams[k]});S.rosterVersion=2;S.leagues=(S.leagues||['Campeonato Brasileiro Série A','Campeonato Brasileiro Série B']).flatMap(l=>l==='MLS'?['MLS – Conferência Leste','MLS – Conferência Oeste']:[l]);if(S.leagues.some(l=>l==='Campeonato Brasileiro Série A'||l==='Campeonato Brasileiro Série B'))S.leagues=[...new Set([...S.leagues,'Campeonato Brasileiro Série A','Campeonato Brasileiro Série B'])];if(S.leagues.some(l=>l.startsWith('MLS – Conferência')))S.leagues=[...new Set([...S.leagues,'MLS – Conferência Leste','MLS – Conferência Oeste'])];S.youthPool=S.youthPool||randomYouth(2);S.playerOffers=S.playerOffers||[];S.leagueTables=S.leagueTables||{};S.clients=S.clients||[];if(S.week===undefined||S.week===null)S.week=0;S.seasonHistory=S.seasonHistory||[];S.seasonYear=S.seasonYear||S.year||2026;S.year=S.seasonYear;S.transferOffers=S.transferOffers||[];S.playerOffers=S.playerOffers||[];S.leagueTables=S.leagueTables||{};S.leagueTeams=S.leagueTeams||null;S.window2Active=!!S.window2Active;S.repEventKeys=S.repEventKeys||[];render()}
function returnMainMenu(){autoSave();S.page='mainmenu';render()}
function deleteSave(){if(!confirm('Excluir definitivamente o save desta agência neste navegador?'))return;localStorage.removeItem('careerAgentSave');savedCareer=null;S=initial();S.page='mainmenu';render();toast('Save excluído.')}
function about(){alert('Career Agent — simulador de empresário de futebol. Você administra uma agência e representa jogadores. Os clubes são equipes reais do mercado, não instituições controladas pelo jogador.');}
function go(p){S.page=p;render()}
function dashboard(){let v=S.clients.reduce((a,p)=>a+p.value,0);return head('Painel da agência','Visão geral','Acompanhe o crescimento da sua agência e as carreiras dos atletas representados.',`<div class="actions"><button class="primary" onclick="go('negotiations')">Buscar jovens jogadores</button><button onclick="advanceWeek()">Avançar semana</button></div>`)+`<div class="grid stats">${stat('Jogadores representados',S.clients.length,'Atletas sob contrato')}${stat('Valor do portfólio',fmt(v),'Valor estimado','green')}${stat('Saldo da agência',fmt(S.cash),'Caixa disponível')}${stat('Reputação',S.rep+'/100','Credibilidade no mercado')}</div><div class="grid cols">${card('Identidade profissional',`${row('Agência',S.agency)}${row('Agente',S.agent)}${row('Ligas acompanhadas',S.leagues.join(' • ')||'Nenhuma selecionada')}<div class="notice">Você é um empresário independente. Não existe clube de referência: os clubes são parte do mercado de transferências.</div><button style="margin-top:10px" onclick="go('agency')">Editar dados da agência</button>`)}${card('Atividade da agência',`${row('Comissão média','8%')}${row('Receita mensal estimada',fmt(S.income))}${row('Despesas mensais',fmt(S.expenses))}${row('Propostas em análise',S.deals.filter(d=>d.status==='Em análise').length)}<div class="notice">Sua missão é descobrir talentos, conquistar a confiança dos jogadores e negociar as melhores oportunidades.</div>`)}</div><div class="grid cols" style="margin-top:14px">${card('Meus jogadores',S.clients.slice(0,4).map(p=>`<div class="item"><div><strong>${p.name}</strong><div class="muted small">${p.pos} • ${p.club}</div></div><strong class="green">${p.rating}</strong></div>`).join('')||'<div class="empty">Você ainda não representa nenhum jogador. Escolha talentos na aba Jovens disponíveis.</div>'+`<button style="margin-top:10px" onclick="go('negotiations')">Ver jovens disponíveis</button>`)}${card('Últimas notícias',S.news.slice(0,5).map(x=>`<div class="logline">${x}</div>`).join(''))}</div>`}
function playerHistoryMarkup(p){const seasons=Object.entries(p.seasonStats||{}).sort((a,b)=>Number(b[0])-Number(a[0]));const clubs=(p.clubHistory||[{club:p.club,fromYear:S.seasonYear}]).slice().reverse();return `<details style="margin-top:12px;background:#111e31;border:1px solid var(--line);border-radius:9px;padding:10px"><summary style="cursor:pointer;font-weight:750">Histórico da carreira</summary><div style="margin-top:10px"><strong>Clubes por onde passou</strong>${clubs.map(c=>`<div class="item"><span>${c.club}</span><span class="muted small">${c.fromYear||'?'}${c.toYear?'–'+c.toYear:'– atual'}${c.type?' • '+c.type:''}</span></div>`).join('')||'<div class="muted small">Sem histórico de clubes.</div>'}</div><div class="divider"></div><strong>Estatísticas por temporada</strong>${seasons.map(([year,x])=>`<div class="card" style="padding:10px;margin-top:8px"><div class="row"><strong>Temporada ${year}</strong><strong class="green">${x.apps?((x.ratingSum/x.apps).toFixed(2)):'—'} média</strong></div><div class="muted small">${x.apps||0} partidas • ${x.goals||0} gols • ${x.assists||0} assistências</div></div>`).join('')||'<div class="muted small">As estatísticas serão registradas a partir das partidas simuladas.</div>'}</div></details>`}
function currentSeasonStats(p){const x=(p.seasonStats||{})[S.seasonYear]||{apps:0,goals:0,assists:0,ratingSum:0};return {apps:x.apps||0,goals:x.goals||0,assists:x.assists||0,average:x.apps?(x.ratingSum/x.apps).toFixed(2):'—'};}
function clientsPage(){return head('Portfólio','Meus jogadores','Gerencie contratos, valores, relações e oportunidades dos atletas que você representa.',`<div class="actions"><button class="primary" onclick="go('negotiations')">+ Negociar jovens</button></div>`)+`<div class="playergrid">${S.clients.map((p,i)=>`<div class="playercard"><div class="playerhead"><div><strong>${p.name}</strong><div class="muted small">${p.pos} • ${p.age} anos • ${p.country}</div></div><div class="rating">${p.rating}</div></div><div class="divider"></div>${row('Clube atual',p.club)}${row('Valor estimado',fmt(p.value))}${row('Salário',fmt(p.wage)+'/mês')}${row('Contrato',p.contract)}${row('Sua comissão',p.fee+'%')}${row('Relacionamento',p.relationship+'/100')}${(()=>{const st=currentSeasonStats(p);return row('Temporada '+S.seasonYear,`${st.apps} jogos • ${st.goals} gols • ${st.assists} assist. • média ${st.average}`)})()}${p.lastMatch?row('Última partida',p.lastMatch):''}${p.loan?row('Empréstimo',p.loan.to+' • temporário'):''}${playerHistoryMarkup(p)}<div class="bar"><i style="width:${p.relationship}%"></i></div><div class="actions" style="margin-top:12px"><button onclick="negotiateRenew(${i})">Renovar representação</button><button class="danger" onclick="releaseClient(${i})">Encerrar contrato</button></div></div>`).join('')||'<div class="empty">Você ainda não representa jogadores. Acesse Jovens disponíveis para negociar seu primeiro contrato de representação.</div>'}</div>`}
function negotiations(){return head('Recrutamento','Jovens disponíveis','A agência apresenta dois jovens fictícios por janela. Você decide quem contratar ou excluir.')+`<div class="notice" style="margin-bottom:14px">A lista começa com dois jovens aleatórios. Novos talentos só serão encontrados quando abrir uma janela de transferências (semana 20 ou 38).</div><div class="playergrid">${(S.youthPool||[]).map(p=>`<div class="playercard"><div class="playerhead"><div><strong>${p.name}</strong><div class="muted small">${p.age} anos • ${p.country}</div></div><div class="rating">${p.rating}</div></div><div class="divider"></div>${row('Posição',p.pos)}${row('Clube atual',p.club)}${row('Potencial',p.potential+'/100')}${row('Valor estimado',fmt(p.value))}${row('Situação',p.contract)}<div class="formgrid" style="margin-top:12px"><div><label>Comissão proposta (%)</label><input id="fee_${p.id}" type="number" min="5" max="15" value="8"></div><div><label>Duração (meses)</label><select id="term_${p.id}"><option value="12">12 meses</option><option value="24" selected>24 meses</option><option value="36">36 meses</option></select></div></div><button class="primary" style="width:100%;margin-top:10px" onclick="approachYouth('${p.id}')">Contratar jogador</button><button class="danger" style="width:100%;margin-top:8px" onclick="deleteYouth('${p.id}')">Excluir jogador achado</button></div>`).join('')||'<div class="empty">Nenhum jovem encontrado. A agência buscará dois novos jogadores na próxima abertura de janela.</div>'}</div>`}
function approachYouth(id){let p=(S.youthPool||[]).find(x=>x.id===id);if(!p)return;if(S.clients.some(x=>x.id===id))return toast('Você já representa este jogador.');let fee=Number(document.getElementById('fee_'+id)?.value||8),term=Number(document.getElementById('term_'+id)?.value||24);if(fee<5||fee>15)return toast('A comissão deve ficar entre 5% e 15%.');let chance=Math.max(.25,Math.min(.95,.48+(fee-8)*.055+(S.rep-10)*.003+(term>=24?.06:0)));if(Math.random()>chance){log(`${p.name} recusou a proposta de ${fee}% por ${term} meses.`);S.rep=Math.max(0,S.rep-1);autoSave();render();return toast(p.name+' recusou a proposta. Você pode tentar novamente com melhores condições.')}let client={...p,fee,term,relationship:58,status:'Contrato ativo',seasonStats:{[S.seasonYear]:{apps:0,goals:0,assists:0,ratingSum:0}},clubHistory:[{club:p.club,fromYear:S.seasonYear,type:'Atual'}]};S.clients.push(client);S.youthPool=S.youthPool.filter(x=>x.id!==id);S.rep=Math.min(100,S.rep+3);S.income+=.002;log(`${p.name} aceitou a proposta de representação: comissão de ${fee}% por ${term} meses.`);autoSave();render();toast(p.name+' assinou com sua agência!')}
function agency(){return head('Estrutura profissional','Minha agência','Organize sua operação, identidade e reputação como empresário.')+`<div class="grid cols">${card('Dados da agência',`<div class="stack"><label>Nome da agência</label><input id="agencyName" value="${S.agency}"><label>Nome do empresário</label><input id="agentName" value="${S.agent}"><button class="primary" onclick="saveAgency()">Salvar identidade</button></div>`)}${card('Indicadores',`${row('Atletas representados',S.clients.length)}${row('Reputação',S.rep+'/100')}${row('Valor do portfólio',fmt(S.clients.reduce((a,p)=>a+p.value,0)))}${row('Negociações concluídas',S.deals.filter(d=>d.status==='Aceita').length)}`)}</div>`}
function finance(){return head('Administração','Finanças da agência','Controle comissões, despesas e saldo operacional.')+`<div class="grid stats">${stat('Saldo',fmt(S.cash),'Caixa disponível')}${stat('Receita mensal',fmt(S.income),'Comissões estimadas','green')}${stat('Despesas',fmt(S.expenses),'Custos operacionais')}${stat('Resultado',fmt(S.income-S.expenses),'Saldo mensal',(S.income>=S.expenses?'green':'red'))}</div><div class="grid cols">${card('Movimentações',`${row('Comissões recebidas',fmt(S.income))}${row('Despesas da agência',fmt(S.expenses))}${row('Resultado mensal',fmt(S.income-S.expenses))}`)}${card('Investir na agência',`<label>Investimento em prospecção (€)</label><input id="investValue" type="number" min="1000" step="1000" value="5000"><button class="primary" style="margin-top:10px" onclick="investAgency()">Investir em observação de mercado</button><p class="muted small">Aumenta sua reputação e fortalece a rede de contatos da agência.</p>`)}</div>`}

function roundRobin(teams){const arr=teams.slice();if(arr.length%2)arr.push(null);const n=arr.length,rounds=[];for(let r=0;r<n-1;r++){const games=[];for(let i=0;i<n/2;i++){const h=arr[i],a=arr[n-1-i];if(h&&a)games.push(r%2?{home:a,away:h}:{home:h,away:a});}rounds.push(games);arr.splice(1,0,arr.pop());}return rounds.concat(rounds.map(g=>g.map(x=>({home:x.away,away:x.home}))));}
function ensureLeagueTables(){S.leagueTables=S.leagueTables||{};S.leagues.forEach(l=>{if((leagueTeams[l]||[]).length>0)getStandings(l)});}
function playWeeklyFixtures(){const reports=[];ensureLeagueTables();S.leagues.forEach(league=>{const teams=leagueTeams[league]||[];if(!teams.length||S.week<1||S.week>38)return;let fixtures=[];if(league==='MLS – Conferência Leste'&&S.week>=31&&S.week<=36){const east=leagueTeams['MLS – Conferência Leste'],west=leagueTeams['MLS – Conferência Oeste'],round=S.week-31;fixtures=east.map((team,i)=>{const rival=west[(i+round)%west.length];return round%2?{home:rival,away:team}:{home:team,away:rival}})}else if(league==='MLS – Conferência Oeste'&&S.week>30)return;else{const schedule=roundRobin(teams);if(S.week>schedule.length)return;fixtures=schedule[S.week-1]||[]}fixtures.forEach(f=>{const hLeague=(league==='MLS – Conferência Leste'&&leagueTeams['MLS – Conferência Oeste'].includes(f.home))?'MLS – Conferência Oeste':league,aLeague=(league==='MLS – Conferência Leste'&&leagueTeams['MLS – Conferência Oeste'].includes(f.away))?'MLS – Conferência Oeste':league,h=getStandings(hLeague).find(t=>t.team===f.home),a=getStandings(aLeague).find(t=>t.team===f.away);if(!h||!a)return;const hg=Math.floor(Math.random()*4),ag=Math.floor(Math.random()*4);S.matchHistory=S.matchHistory||[];S.matchHistory.push({season:S.seasonYear,week:S.week,league,home:f.home,away:f.away,homeGoals:hg,awayGoals:ag});h.j++;a.j++;h.gf+=hg;h.ga+=ag;a.gf+=ag;a.ga+=hg;if(hg>ag){h.w++;a.l++;h.pts+=3}else if(hg<ag){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}S.clients.filter(p=>p.club===h.team||p.club===a.team).forEach(p=>{const played=Math.random()<.84,att=['Centroavante','Ponta-direita','Ponta-esquerda','ATA'].includes(p.pos),goals=played&&Math.random()<(att?.28:.07)?1:0,assists=played&&Math.random()<.16?1:0,rating=played?Number((5.8+Math.random()*3.4+goals*.8+assists*.35).toFixed(1)):0;p.lastMatch=played?`${hg}-${ag} • Nota ${rating}${goals?' • Gol':''}${assists?' • Assistência':''}`:'Não entrou em campo';p.form=Math.max(1,Math.min(99,Math.round((p.form||p.rating)+((rating||6.1)-6.5)*.3)));p.seasonStats=p.seasonStats||{};const st=p.seasonStats[S.seasonYear]||(p.seasonStats[S.seasonYear]={apps:0,goals:0,assists:0,ratingSum:0});if(played){st.apps++;st.goals+=goals;st.assists+=assists;st.ratingSum+=rating;}if(played&&rating>=8.5&&p.rating<99&&Math.random()<.08)p.rating++;});if(S.clients.some(p=>p.club===h.team||p.club===a.team))reports.push(`${h.team} ${hg}–${ag} ${a.team}`);});});return reports;}
function clubOfferFor(p){const all=transferClubs(p.club);if(!all.length)return null;const rating=Number(p.rating||50),top=['Flamengo','Palmeiras','Real Madrid','Barcelona','Manchester City','Bayern München','Arsenal','Liverpool'],mid=['Corinthians','São Paulo','Botafogo','Bahia','Porto','Benfica','Napoli','Aston Villa','Grêmio','Internacional'],lower=['Ceará','Sport','Vitória','Goiás','Avaí','Vila Nova','Novorizontino','Braga','América-MG','Paysandu'];let group=rating>=82?top:rating>=70?mid:lower,preferred=all.filter(c=>group.includes(c));if(!preferred.length)preferred=all;const to=preferred[Math.floor(Math.random()*preferred.length)],loan=rating<73&&Math.random()<.58,fee=loan?0:Number((Math.max(.04,p.value||.08)*(.75+Math.random()*.9)).toFixed(2));return {id:Date.now()+Math.floor(Math.random()*99999),playerId:p.id||p.name,player:p.name,from:p.club,to,type:loan?'Empréstimo':'Transferência',fee,wage:Number(((p.wage||.001)*(.9+Math.random()*.55)).toFixed(3)),years:loan?1:3,status:'Nova proposta',week:S.week,season:S.seasonYear,note:loan?'Oferta de empréstimo para dar minutos ao jovem.':'Oferta de contratação baseada no OVR e na situação do clube.'};}
function generateClubOffers(){S.playerOffers=S.playerOffers||[];S.clients.forEach(p=>{let context=0,rank=0;for(const league of S.leagues){const table=getStandings(league),sorted=table.slice().sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga));rank=sorted.findIndex(t=>t.team===p.club)+1;if(rank>0){if(rank>=16)context=.10;else if(rank<=5)context=.04;break}}const chance=(p.rating>=85?.22:p.rating>=75?.16:p.rating>=65?.11:.06)+context;if(Math.random()<chance&&!S.playerOffers.some(o=>o.playerId===(p.id||p.name)&&o.status==='Nova proposta')){const o=clubOfferFor(p);if(o){o.clubSituation=rank?`Clube atual na posição ${rank} da liga`:'Interesse baseado no OVR';S.playerOffers.unshift(o);log(`${o.to} enviou uma proposta de ${o.type.toLowerCase()} por ${p.name} (${o.clubSituation}).`);}}});S.playerOffers=S.playerOffers.slice(0,60);}
function rewardReputation(key,label){S.repEventKeys=S.repEventKeys||[];if(S.repEventKeys.includes(key))return;S.repEventKeys.push(key);const before=S.rep;S.rep=Math.min(100,S.rep+2);log(`${label}: reputação +${S.rep-before}.`);}
function refreshYouthAtWindow(){const found=randomYouth(2);S.youthPool=(S.youthPool||[]).concat(found);log(`A agência encontrou dois novos jovens: ${found.map(p=>p.name).join(' e ')}.`);}
function resolvePlayerOffer(id,accept){const o=S.playerOffers.find(x=>x.id===id);if(!o||o.status!=='Nova proposta')return;const p=S.clients.find(x=>(x.id||x.name)===o.playerId||x.name===o.player);if(!p){o.status='Cancelada';autoSave();render();return}if(!accept){o.status='Recusada';o.note='Oferta recusada pela agência.';log(`Oferta de ${o.to} por ${p.name} recusada.`)}else if(!windowStatus().open)return toast('A janela de transferências está fechada.');else{const old=p.club;p.clubHistory=p.clubHistory||[];if(p.clubHistory.length)p.clubHistory[p.clubHistory.length-1].toYear=S.seasonYear;p.clubHistory.push({club:o.to,fromYear:S.seasonYear,type:o.type});p.club=o.to;p.wage=o.wage;if(o.type==='Empréstimo')p.loan={from:old,to:o.to,untilWeek:Math.min(46,S.week+12),season:S.seasonYear};else{p.contract=`${o.years} anos (novo vínculo)`;p.value=Math.max(p.value||0,o.fee);p.lastTransfer={from:old,to:o.to,fee:o.fee,week:S.week,year:S.seasonYear}}const commission=o.type==='Empréstimo'?(o.wage||0)*12*(Number(p.fee||8)/100):(o.fee||0)*(Number(p.fee||8)/100);S.cash+=commission;S.income+=commission/12;S.rep=Math.min(100,S.rep+2);o.status='Aceita';o.note=o.type==='Empréstimo'?`Empréstimo aceito: ${p.name} defenderá ${o.to} temporariamente.`:`Transferência concluída para ${o.to}.`;log(`${o.type} aceito: ${p.name}, ${old} → ${o.to}. Comissão da agência: ${fmt(commission)}.`)}autoSave();render();toast(accept?'Oferta aceita.':'Oferta recusada.')}
function finalizeSeason(){S.seasonHistory=S.seasonHistory||[];const movement={year:S.seasonYear,leagues:{}};const a='Campeonato Brasileiro Série A',b='Campeonato Brasileiro Série B';[a,b].forEach(l=>{if(!S.leagues.includes(l))return;const sorted=getStandings(l).slice().sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf);movement.leagues[l]=sorted.map((t,i)=>({team:t.team,position:i+1,pts:t.pts}));});if(movement.leagues[a]&&movement.leagues[b]){movement.relegated=movement.leagues[a].slice(-4).map(x=>x.team);movement.promoted=movement.leagues[b].slice(0,4).map(x=>x.team);log(`Fim da temporada ${S.seasonYear}: acesso ${movement.promoted.join(', ')}; rebaixamento ${movement.relegated.join(', ')}.`);}S.seasonHistory.unshift(movement);S.seasonHistory=S.seasonHistory.slice(0,15);S.seasonFinalizedYear=S.seasonYear;}
function applyPromotionRelegation(){const a='Campeonato Brasileiro Série A',b='Campeonato Brasileiro Série B',h=S.seasonHistory?.find(x=>x.year===S.seasonYear);if(!h?.promoted||!h?.relegated||!leagueTeams[a]||!leagueTeams[b])return;leagueTeams[a]=leagueTeams[a].filter(t=>!h.relegated.includes(t)).concat(h.promoted);leagueTeams[b]=leagueTeams[b].filter(t=>!h.promoted.includes(t)).concat(h.relegated);S.leagueTeams={...S.leagueTeams,[a]:leagueTeams[a].slice(),[b]:leagueTeams[b].slice()};S.leagueTables={};ensureLeagueTables();log(`Acesso e rebaixamento aplicados para ${S.seasonYear}: quatro clubes subiram e quatro desceram.`);}
function advanceWeek(){
 const old=S.week;
 if(old===38){
  if(S.seasonFinalizedYear!==S.seasonYear)finalizeSeason();
  applyPromotionRelegation();
  S.week=0;S.seasonYear++;S.year=S.seasonYear;S.leagueTables={};ensureLeagueTables();S.window2Active=true;
  rewardReputation(`year-${S.seasonYear}`,`Início do ano ${S.seasonYear}`);
  log(`Ano ${S.seasonYear} iniciado. A segunda janela continua aberta até a semana 6.`);
 }else{
  S.week=old+1;
  if(S.week===20){refreshYouthAtWindow();rewardReputation(`${S.seasonYear}-window1`,'Abertura da primeira janela');log('Primeira janela aberta (semanas 20–25).');}
  if(S.week===26)log('Primeira janela encerrada. Mercado fechado.');
  if(S.week===38){refreshYouthAtWindow();S.window2Active=true;rewardReputation(`${S.seasonYear}-window2`,'Abertura da segunda janela');log(`Temporada ${S.seasonYear} encerrada. Campeonato concluído e segunda janela aberta até a semana 6 do próximo ano.`);}
  if(S.week===7&&S.window2Active){S.window2Active=false;log('Segunda janela encerrada após a semana 6.');}
 }
 S.clients.forEach(p=>{if(p.loan&&((p.loan.season===S.seasonYear&&S.week>=p.loan.untilWeek)||S.seasonYear>p.loan.season)){const parent=p.loan.from;p.clubHistory=p.clubHistory||[];if(p.clubHistory.length)p.clubHistory[p.clubHistory.length-1].toYear=S.seasonYear;p.clubHistory.push({club:parent,fromYear:S.seasonYear,type:'Retorno de empréstimo'});p.club=parent;delete p.loan;log(`${p.name} retornou do empréstimo ao ${parent}.`);}});
 const results=playWeeklyFixtures();
 if(S.week===38&&S.seasonFinalizedYear!==S.seasonYear)finalizeSeason();
 generateClubOffers();S.cash+=(S.income-S.expenses)/4;S.clients.forEach(p=>{p.relationship=Math.max(35,Math.min(100,(p.relationship||55)+(Math.random()>.35?1:-1)))});
 log(S.week===0?`Semana 0: início da pré-temporada ${S.seasonYear}.`:`Semana ${S.week}: ${S.week<=38?'rodada simulada':'período de mercado'}${results.length?' — '+results.slice(0,3).join(' | ')+(results.length>3?' e outros jogos':''):''}.`);
 autoSave();render();toast(S.week===0?`Ano ${S.seasonYear}: pré-temporada iniciada.`:`Semana ${S.week}: ${S.week<=38?'partidas simuladas':'mercado atualizado'}.`);
}
function news(){return head('Central de informação','Notícias','Acompanhe os acontecimentos da sua agência e do mercado.')+card('Últimos acontecimentos',S.news.map(x=>`<div class="logline">▸ ${x}</div>`).join(''))}
function signPlayer(i){let p=S.scouted[i];if(!p)return;if(S.clients.some(x=>x.name===p.name))return toast('Este jogador já está representado.');let n={...p,fee:8,relationship:55,status:'Contrato ativo',seasonStats:{[S.seasonYear]:{apps:0,goals:0,assists:0,ratingSum:0}},clubHistory:[{club:p.club,fromYear:S.seasonYear,type:'Atual'}]};S.clients.push(n);S.scouted.splice(i,1);S.rep=Math.min(100,S.rep+2);log(`Contrato de representação assinado com ${p.name}.`);S.income+=.01;autoSave();render();toast(p.name+' agora faz parte do seu portfólio.')}
function deleteYouth(id){const p=(S.youthPool||[]).find(x=>x.id===id);if(!p)return;if(!confirm('Excluir '+p.name+' da lista de jovens encontrados?'))return;S.youthPool=S.youthPool.filter(x=>x.id!==id);log(`${p.name} foi removido da lista de jovens encontrados.`);autoSave();render();toast('Jogador excluído da lista.')}
function releaseClient(i){let p=S.clients[i];if(!p)return;if(!confirm('Encerrar o contrato de representação de '+p.name+'?'))return;S.clients.splice(i,1);log(`Contrato de representação encerrado com ${p.name}.`);autoSave();render()}
function negotiateRenew(i){let p=S.clients[i];if(!p)return;p.fee=Math.min(15,p.fee+1);p.relationship=Math.min(100,p.relationship+8);p.status='Representação renovada';log(`Representação de ${p.name} renovada. Comissão ajustada para ${p.fee}%.`);autoSave();render();toast('Contrato de representação renovado.')}
function createDeal(){let p=S.clients[Number(document.getElementById('dealPlayer').value)];if(!p)return toast('Adicione jogadores ao portfólio primeiro.');let club=document.getElementById('dealClub').value,value=Number(document.getElementById('dealValue').value),fee=Number(document.getElementById('dealFee').value);if(value<=0||fee<1||fee>20)return toast('Confira os valores da proposta.');S.deals.unshift({id:Date.now(),player:p.name,club,value,fee,status:'Em análise'});log(`Proposta enviada por ${p.name}: ${club} ofereceu ${fmt(value)}.`);autoSave();render()}
function dealDecision(id,yes){let d=S.deals.find(x=>x.id===id);if(!d)return;d.status=yes?'Aceita':'Recusada';if(yes){let commission=d.value*d.fee/100;S.cash+=commission;S.income+=commission/12;S.rep=Math.min(100,S.rep+3);log(`Acordo aceito: ${d.player} negociado com ${d.club}. Comissão da agência: ${fmt(commission)}.`)}else log(`Proposta por ${d.player} recusada pela agência.`);autoSave();render()}
function saveAgency(){S.agency=document.getElementById('agencyName').value.trim()||'Minha Agência';S.agent=document.getElementById('agentName').value.trim()||'Empresário';log('Identidade da agência atualizada.');autoSave();render();toast('Dados da agência salvos.')}
function investAgency(){let n=Number(document.getElementById('investValue').value)/100000;if(n<=0||n>S.cash)return toast('Saldo insuficiente ou valor inválido.');S.cash-=n;S.rep=Math.min(100,S.rep+2);log(`Agência investiu ${fmt(n)} em observação de mercado e relacionamento.`);autoSave();render()}
function advanceMonth(){let net=S.income-S.expenses;S.cash+=net;S.month++;if(S.month>11){S.month=0;S.year++}S.clients.forEach(p=>{p.relationship=Math.max(35,Math.min(100,p.relationship+(Math.random()>.35?2:-1))) });log(`Relatório mensal: ${net>=0?'resultado positivo':'resultado negativo'} de ${fmt(net)}.`);autoSave();render()}
render();
